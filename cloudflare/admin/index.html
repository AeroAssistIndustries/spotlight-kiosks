<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="/admin/brand/favicon.svg">
<title>CityPulse Kiosk Dashboard</title>
<style>
:root {
  --bg: #f5f5f7; --card: #fff; --ink: #1d1d1f; --ink2: #424245; --mute: #6e6e73; --line: #d2d2d7; --soft: #e8e8ed;
  --blue: #0B7F74; --blue-ink: #fff; --gold: #0F1C2B; --teal: #16B8A8; --green: #1d7a3a; --red: #c4001a; --amber: #8a5a00;
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 6px 24px rgba(0,0,0,.06);
  --r: 18px;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000; --card: #1c1c1e; --ink: #f5f5f7; --ink2: #d1d1d6; --mute: #a1a1a6; --line: #3a3a3c; --soft: #2c2c2e;
    --blue: #2FD4C3; --blue-ink: #04201d; --gold: #e3b45a; --teal: #16B8A8; --green: #4cd27a; --red: #ff6b6b; --amber: #ffcc66;
    --shadow: 0 0 0 1px #2c2c2e; color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font-size: 16px; line-height: 1.45; -webkit-font-smoothing: antialiased; min-height: 100vh; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--blue); }
h1, h2, h3 { letter-spacing: -.02em; margin: 0; }
h1 { font-size: 28px; font-weight: 700; }
h2 { font-size: 21px; font-weight: 650; }
h3 { font-size: 17px; font-weight: 600; }
p { margin: 0; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; border-radius: 6px; }

/* sign in */
.login { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
.login-card { width: 100%; max-width: 400px; background: var(--card); border-radius: 22px; padding: 36px 32px; box-shadow: var(--shadow); }
.logo { display: block; }
.logo .on-dark { display: none; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .logo .on-light { display: none; } :root:not([data-theme="light"]) .logo .on-dark { display: block; } }
.logo img { display: block; height: 100%; width: auto; }
.login-card .logo { height: 58px; margin-bottom: 26px; }
.login-card .eyebrow { display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--blue); margin-bottom: 6px; }
.login-foot { margin-top: 22px; padding-top: 16px; border-top: 1px solid var(--soft); font-size: 13px; color: var(--mute); text-align: center; }
.login-card h1 { font-size: 26px; }
.login-card p { color: var(--mute); margin: 6px 0 22px; }
.login-card .btn { width: 100%; margin-top: 14px; }
.msg { margin-top: 14px; padding: 10px 14px; border-radius: 12px; background: color-mix(in srgb, var(--red) 10%, transparent); color: var(--red); font-size: 15px; }
.msg.info { background: var(--soft); color: var(--ink2); }

/* frame */
.top { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1180px; margin: 0 auto; padding: 12px 24px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 12px; margin-right: auto; min-width: 0; }
.brand .logo { height: 38px; flex: none; }
.brand .sep { width: 1px; height: 30px; background: var(--line); flex: none; }
.top { border-top: 3px solid var(--teal); }
.foot { max-width: 1180px; margin: 0 auto; padding: 0 24px 110px; display: flex; align-items: center; gap: 12px; color: var(--mute); font-size: 13px; }
.foot img { height: 24px; width: 24px; border-radius: 6px; }
@media (max-width: 560px) { .brand .sep, .brand .venue-name { display: none; } }
.brand b { display: block; font-size: 16px; }
.brand small { display: block; color: var(--mute); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.state { font-size: 14px; color: var(--mute); display: flex; align-items: center; gap: 8px; }
.state i { width: 8px; height: 8px; border-radius: 50%; background: var(--green); display: inline-block; }
.state.dirty i { background: var(--amber); }
.state.dirty { color: var(--ink); }
.tabs { max-width: 1180px; margin: 0 auto; padding: 0 16px; display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { border: 0; background: none; padding: 10px 14px 12px; font-size: 15px; color: var(--mute); cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; min-height: 44px; }
.tabs button[aria-current="page"] { color: var(--ink); border-bottom-color: var(--ink); font-weight: 600; }
main { max-width: 1180px; margin: 0 auto; padding: 28px 24px 40px; }
.head { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
.head > div:first-child { margin-right: auto; }
.head p { color: var(--mute); margin-top: 4px; max-width: 640px; }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 20px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); cursor: pointer; font-size: 15px; font-weight: 500; text-decoration: none; color: var(--ink); white-space: nowrap; }
.btn:hover { border-color: var(--mute); }
.btn.primary { background: var(--blue); border-color: var(--blue); color: var(--blue-ink); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--red); }
.btn.danger.armed { background: var(--red); border-color: var(--red); color: #fff; }
.btn.ghost { background: transparent; }
.btn.small { min-height: 36px; padding: 0 14px; font-size: 14px; }
.btn:disabled { opacity: .45; cursor: default; filter: none; }
.icon-btn { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--card); cursor: pointer; display: inline-grid; place-items: center; font-size: 17px; }
.icon-btn:disabled { opacity: .35; cursor: default; }
.seg { display: inline-flex; background: var(--soft); border-radius: 999px; padding: 3px; }
.seg button { border: 0; background: none; padding: 7px 14px; border-radius: 999px; cursor: pointer; font-size: 14px; color: var(--ink2); min-height: 36px; }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.12); }

/* cards */
.card { background: var(--card); border-radius: var(--r); box-shadow: var(--shadow); padding: 22px; }
.card + .card, .card + .grid, .grid + .card, .grid + .grid { margin-top: 18px; }
.grid { display: grid; gap: 18px; }
.grid > .card { margin-top: 0; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
@media (max-width: 900px) { .g5 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g2 { grid-template-columns: 1fr; } }
.stat b { display: block; font-size: 34px; font-weight: 700; letter-spacing: -.03em; line-height: 1.1; margin-top: 4px; }
.stat span { color: var(--mute); font-size: 14px; }
.stat small { display: block; color: var(--mute); font-size: 13px; margin-top: 2px; }
.card h2 + p, .card h3 + p { color: var(--mute); margin-top: 4px; font-size: 15px; }
.card-head { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.card-head > :first-child { margin-right: auto; }

table { width: 100%; border-collapse: collapse; font-size: 15px; }
th { text-align: left; font-weight: 600; color: var(--mute); font-size: 13px; padding: 8px 10px; border-bottom: 1px solid var(--line); }
td { padding: 11px 10px; border-bottom: 1px solid var(--soft); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.table-wrap { overflow-x: auto; }
.bar { height: 6px; background: var(--soft); border-radius: 3px; overflow: hidden; min-width: 60px; }
.bar i { display: block; height: 100%; background: var(--blue); border-radius: 3px; }
.list { margin: 0; padding: 0; list-style: none; }
.list li { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 9px 0; border-bottom: 1px solid var(--soft); align-items: center; }
.list li:last-child { border-bottom: 0; }
.list li .bar { grid-column: 1 / -1; }
.list b { font-variant-numeric: tabular-nums; font-weight: 600; }
.empty { color: var(--mute); padding: 18px 0; text-align: center; font-size: 15px; }
.chart { width: 100%; height: 170px; display: block; }
.chart text { fill: var(--mute); font-size: 11px; }
.legend { display: flex; gap: 16px; font-size: 13px; color: var(--mute); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; padding: 3px 10px; border-radius: 999px; background: var(--soft); color: var(--ink2); white-space: nowrap; }
.pill.ok { background: color-mix(in srgb, var(--green) 14%, transparent); color: var(--green); }
.pill.warn { background: color-mix(in srgb, var(--amber) 16%, transparent); color: var(--amber); }
.pill.off { background: var(--soft); color: var(--mute); }
.pill i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }

/* forms */
.fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 18px; }
.fields .full { grid-column: 1 / -1; }
@media (max-width: 700px) { .fields { grid-template-columns: 1fr; } }
label.f { display: block; }
label.f > span { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; font-weight: 600; color: var(--ink2); margin-bottom: 6px; }
label.f > span em { font-style: normal; font-weight: 400; color: var(--mute); }
label.f > small { display: block; color: var(--mute); font-size: 13px; margin-top: 5px; }
input[type=text], input[type=url], input[type=email], input[type=tel], input[type=number], input[type=search], input[type=password], select, textarea {
  width: 100%; min-height: 44px; padding: 10px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); font-size: 16px; }
textarea { min-height: 96px; resize: vertical; line-height: 1.45; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 4px color-mix(in srgb, var(--blue) 18%, transparent); }
.check { display: flex; align-items: center; gap: 10px; min-height: 36px; cursor: pointer; font-size: 15px; }
.check input { width: 20px; height: 20px; accent-color: var(--blue); }
.checks { display: flex; flex-wrap: wrap; gap: 4px 18px; }
.switch { position: relative; display: inline-flex; align-items: center; gap: 10px; cursor: pointer; font-size: 15px; min-height: 44px; }
.switch input { appearance: none; -webkit-appearance: none; width: 51px; height: 31px; border-radius: 999px; background: var(--line); position: relative; cursor: pointer; transition: background .2s; margin: 0; flex: none; }
.switch input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 2px 4px rgba(0,0,0,.2); transition: transform .2s; }
.switch input:checked { background: #34c759; }
.switch input:checked::after { transform: translateX(20px); }
.rows { display: grid; gap: 8px; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr) auto; gap: 8px; align-items: center; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 4px; background: var(--soft); border-radius: 999px; padding: 4px 4px 4px 12px; font-size: 14px; }
.chip button { border: 0; background: none; width: 28px; height: 28px; border-radius: 50%; cursor: pointer; color: var(--mute); font-size: 16px; }
.chip button:hover { background: var(--line); color: var(--ink); }

/* editors */
.item { border: 1px solid var(--soft); border-radius: 16px; margin-top: 10px; background: var(--card); }
.item-head { display: flex; align-items: center; gap: 14px; padding: 12px 14px; }
.item-head .t { flex: 1; min-width: 0; }
.item-head .t b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item-head .t small { display: block; color: var(--mute); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item-body { padding: 4px 16px 18px; border-top: 1px solid var(--soft); }
.item-body .fields { margin-top: 14px; }
.item.open { border-color: var(--line); box-shadow: var(--shadow); }
.item-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--soft); }
.item-actions .grow { margin-right: auto; }
.section-title { display: flex; align-items: center; gap: 10px; margin: 26px 0 4px; }
.section-title:first-child { margin-top: 0; }
.section-title h3 { margin-right: auto; }
.section-title span { color: var(--mute); font-size: 14px; }

.ad { display: grid; grid-template-columns: 168px minmax(0, 1fr); gap: 22px; }
@media (max-width: 760px) { .ad { grid-template-columns: 1fr; } }
.logo-box { width: 168px; height: 120px; border-radius: 14px; background: #fff; border: 1px solid var(--line); display: grid; place-items: center; overflow: hidden; padding: 12px; }
.logo-box img { max-width: 100%; max-height: 100%; object-fit: contain; }
.logo-box span { color: #6e6e73; font-weight: 700; font-size: 28px; }
.logo-col { display: grid; gap: 10px; align-content: start; justify-items: start; }
.ad-top { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; flex-wrap: wrap; }
.ad-top h3 { margin-right: auto; }
.photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px; }
.photo { border-radius: 14px; overflow: hidden; background: var(--soft); position: relative; aspect-ratio: 16 / 10; }
.photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.photo .acts { position: absolute; inset: auto 8px 8px 8px; display: flex; gap: 6px; justify-content: flex-end; }
.photo .acts .icon-btn { width: 36px; height: 36px; background: rgba(255,255,255,.92); color: #1d1d1f; border: 0; }
.photo.add { display: grid; place-items: center; border: 2px dashed var(--line); background: transparent; cursor: pointer; color: var(--mute); font-size: 15px; }

/* publish bar and toast */
.publish-bar { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%) translateY(140%); z-index: 30; display: flex; align-items: center; gap: 14px; padding: 10px 10px 10px 22px; border-radius: 999px; background: var(--ink); color: var(--bg); box-shadow: 0 10px 40px rgba(0,0,0,.25); transition: transform .3s cubic-bezier(.2,.8,.2,1), visibility 0s .3s; max-width: calc(100% - 32px); visibility: hidden; }
.publish-bar.show { transform: translateX(-50%) translateY(0); visibility: visible; transition: transform .3s cubic-bezier(.2,.8,.2,1); }
.publish-bar span { font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.publish-bar .btn.ghost { color: var(--bg); border-color: color-mix(in srgb, var(--bg) 35%, transparent); }
.toast { position: fixed; top: 84px; left: 50%; transform: translateX(-50%); z-index: 40; background: var(--card); color: var(--ink); border-radius: 14px; padding: 12px 18px; box-shadow: 0 10px 40px rgba(0,0,0,.18); font-size: 15px; max-width: min(560px, calc(100% - 32px)); display: none; border-left: 4px solid var(--green); }
.toast.err { border-left-color: var(--red); }
.toast.show { display: block; }
.note { background: var(--soft); border-radius: 14px; padding: 14px 16px; color: var(--ink2); font-size: 15px; }
.note b { color: var(--ink); }
.muted { color: var(--mute); }
.loading { padding: 80px 0; text-align: center; color: var(--mute); }

/* alerts */
.alerts { background: color-mix(in srgb, var(--amber) 12%, var(--card)); border: 1px solid color-mix(in srgb, var(--amber) 35%, transparent); border-radius: 14px; padding: 12px 16px; margin-bottom: 18px; display: grid; gap: 6px; font-size: 15px; }
.pill.bad { background: color-mix(in srgb, var(--red) 12%, transparent); color: var(--red); }
button.link { border: 0; background: none; padding: 0; color: var(--ink); font-weight: 600; cursor: pointer; text-align: left; min-height: 32px; }
button.link:hover { color: var(--blue); text-decoration: underline; }
.dates { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 18px; }
@media (max-width: 700px) { .dates { grid-template-columns: 1fr; } }
.maps-row { display: flex; gap: 10px; align-items: flex-end; }
.maps-row label { flex: 1; }
.maps-row .btn { min-height: 44px; }

/* kiosk ad preview: same look as the kiosk's ad panel */
.preview-wrap { margin-top: 6px; }
.preview-wrap.small { width: 168px; }
.kad { width: 100%; max-width: 300px; min-height: 0; border-radius: 16px; padding: 14px 12px 10px; background: linear-gradient(180deg, #13243a, #0b1622); border: 1px solid rgba(217,183,110,.45); color: #fff; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 3px; font-size: 11px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,.18); }
.preview-wrap.small .kad { font-size: 8.5px; padding: 10px 8px 8px; border-radius: 12px; }
.kad-logo { width: 62%; aspect-ratio: 16 / 10; border-radius: 10px; background: #fff; display: grid; place-items: center; padding: 6%; margin-bottom: 6px; }
.kad-logo img { max-width: 100%; max-height: 100%; object-fit: contain; }
.kad-logo span { color: #0f1c2b; font-weight: 800; font-size: 2em; }
.kad-tag { color: #d9b76e; letter-spacing: .14em; text-transform: uppercase; font-weight: 700; font-size: .85em; }
.kad-name { font-size: 1.7em; line-height: 1.1; letter-spacing: -.01em; }
.kad-kind { color: #d9b76e; font-weight: 600; }
.kad-line { color: rgba(255,255,255,.85); line-height: 1.3; }
.kad-web { font-weight: 600; }
.kad-qr { width: 42%; aspect-ratio: 1; margin-top: 6px; background: #fff; border-radius: 6px; padding: 3px; display: grid; place-items: center; }
.kad-qr svg { width: 100%; height: 100%; display: block; }
.kad-qr span { color: #6e6e73; font-size: .8em; padding: 6px; }
.kad-scan { color: rgba(255,255,255,.8); font-size: .85em; }

/* advertiser report */
.report-bar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 18px; }
.report-bar .seg { margin-right: auto; }
.report { background: var(--card); border-radius: var(--r); box-shadow: var(--shadow); padding: 36px 40px; max-width: 900px; margin: 0 auto; }
.report-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-bottom: 18px; border-bottom: 3px solid var(--teal); }
.report-logo { height: 44px; }
.report-title { text-align: right; }
.report-title span { display: block; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--blue); }
.report-title b { font-size: 16px; }
.report-biz { display: flex; gap: 20px; align-items: center; margin: 26px 0 22px; }
.report-biz h1 { font-size: 30px; }
.report-biz p { color: var(--mute); margin-top: 4px; }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 760px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } .report { padding: 22px 18px; } }
.kpi { border: 1px solid var(--soft); border-radius: 14px; padding: 14px 16px; }
.kpi span { color: var(--mute); font-size: 13px; }
.kpi b { display: block; font-size: 30px; letter-spacing: -.03em; margin: 2px 0; }
.kpi small { color: var(--mute); font-size: 12px; line-height: 1.3; display: block; }
.report section { margin-top: 28px; }
.report section h2 { font-size: 18px; margin-bottom: 8px; }
.report .legend { margin-bottom: 6px; }
.report .preview-wrap { width: 220px; }
.report-foot { margin-top: 30px; padding-top: 16px; border-top: 1px solid var(--soft); color: var(--mute); font-size: 13px; display: grid; gap: 6px; }
body.is-report .tabs, body.is-report .publish-bar { display: none; }

/* revenue, deals, announcements, share dialog */
.revenue { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 18px; }
.revenue > div { flex: 1 1 240px; border-radius: var(--r); padding: 18px 22px; color: #fff; background: linear-gradient(135deg, #0F1C2B, #0B4F4A); box-shadow: var(--shadow); }
.revenue > div + div { background: linear-gradient(135deg, #2a3442, #3b4656); }
.revenue span { font-size: 13px; opacity: .8; }
.revenue b { display: block; font-size: 34px; letter-spacing: -.03em; margin: 2px 0; }
.revenue small { opacity: .8; font-size: 13px; }
.deal { margin-top: 16px; border: 1px dashed var(--line); border-radius: 14px; padding: 4px 14px 10px; background: color-mix(in srgb, var(--soft) 40%, transparent); }
.deal.open { border-style: solid; }
.deal-head { width: 100%; border: 0; background: none; padding: 10px 0 4px; display: flex; justify-content: space-between; align-items: center; gap: 12px; cursor: pointer; text-align: left; min-height: 44px; flex-wrap: wrap; }
.deal-head span { font-weight: 600; }
.deal-head em { font-style: normal; font-weight: 400; color: var(--mute); font-size: 13px; margin-left: 6px; }
.deal-head small { color: var(--mute); font-size: 14px; }
.notice-prev { margin-top: 14px; }
.knotice { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 14px; color: #fff; background: linear-gradient(180deg, #2b3a4a, #18242f); border: 1px solid rgba(217,183,110,.6); max-width: 560px; }
.knotice b { font-weight: 600; }
.nowrap { white-space: nowrap; }
.share { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: grid; place-items: center; z-index: 50; padding: 16px; }
.share[hidden] { display: none; }
.share-box { background: var(--card); border-radius: 20px; padding: 24px; width: min(560px, 100%); box-shadow: 0 20px 60px rgba(0,0,0,.3); }
.share-box p { color: var(--mute); margin: 6px 0 14px; font-size: 15px; }

@media print {
  @page { margin: 14mm; }
  :root { --bg: #fff; --card: #fff; --ink: #1d1d1f; --mute: #555; --soft: #e5e5ea; --line: #d2d2d7; --blue: #0B7F74; --gold: #0F1C2B; color-scheme: light; }
  html, body { background: #fff !important; }
  .top, .tabs, .publish-bar, .foot, .no-print, .toast, .alerts { display: none !important; }
  main { padding: 0; max-width: none; }
  .report { box-shadow: none; padding: 0; max-width: none; }
  .report section, .kpis { break-inside: avoid; }
  .logo .on-dark { display: none !important; } .logo .on-light { display: block !important; }
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}
/* =====================================================================
   Dashboard shell (v5): dark sidebar, sticky top bar with clock, bento grid
   ===================================================================== */
:root { --side: 256px; --t-teal: #0FA899; --t-blue: #3B7BF6; --t-violet: #8B5CF6; --t-gold: #C9921E; --t-pink: #E2457F; --navy: #0F1C2B; --bg: #F3F5F8; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0A0E13; --card: #141A22; --soft: #1E2630; --line: #2A3441; --t-teal: #2FD4C3; --t-blue: #6EA0FF; --t-violet: #A98BFF; --t-gold: #F0B94B; --t-pink: #FF7AAA; } }
body { background: var(--bg); }
.shell { display: grid; grid-template-columns: var(--side) minmax(0, 1fr); min-height: 100vh; }
.main { min-width: 0; display: flex; flex-direction: column; }
.ic { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* sidebar */
.side { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 6px; padding: 22px 14px 16px; color: #E7EDF3;
  background: radial-gradient(120% 60% at 0% 0%, rgba(22,184,168,.22), transparent 60%), linear-gradient(180deg, #0F1C2B 0%, #0A1520 100%); border-right: 1px solid rgba(255,255,255,.06); z-index: 40; }
.side-brand { padding: 0 8px 14px; }
.side-brand img { height: 40px; width: auto; display: block; }
.side-venue { display: flex; gap: 10px; align-items: center; padding: 12px; margin: 0 0 10px; border-radius: 14px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.08); }
.side-venue b { display: block; font-size: 14px; line-height: 1.2; }
.side-venue small { color: rgba(231,237,243,.6); font-size: 12px; }
.dot-live { width: 10px; height: 10px; border-radius: 50%; background: #34D399; box-shadow: 0 0 0 0 rgba(52,211,153,.6); animation: pulse 2.4s infinite; flex: none; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(52,211,153,.55) } 70% { box-shadow: 0 0 0 9px rgba(52,211,153,0) } 100% { box-shadow: 0 0 0 0 rgba(52,211,153,0) } }
.side-nav { display: flex; flex-direction: column; gap: 2px; overflow-y: auto; flex: 1; scrollbar-width: none; }
.side-nav button { position: relative; display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border: 0; border-radius: 12px; background: none; color: rgba(231,237,243,.72); font-size: 15px; cursor: pointer; text-align: left; transition: background .15s, color .15s; }
.side-nav button:hover { background: rgba(255,255,255,.06); color: #fff; }
.side-nav button[aria-current="page"] { background: linear-gradient(90deg, rgba(22,184,168,.28), rgba(22,184,168,.08)); color: #fff; font-weight: 600; }
.side-nav button[aria-current="page"]::before { content: ""; position: absolute; left: -14px; top: 10px; bottom: 10px; width: 4px; border-radius: 0 4px 4px 0; background: #16B8A8; box-shadow: 0 0 12px #16B8A8; }
.side-nav button span { flex: 1; }
.badge { display: none; font-style: normal; min-width: 22px; height: 22px; padding: 0 7px; border-radius: 999px; font-size: 12px; font-weight: 700; line-height: 22px; text-align: center; background: rgba(255,255,255,.14); color: #fff; }
.badge.show { display: inline-block; }
.badge.bad { background: #EF4444; } .badge.warn { background: #D99A1E; } .badge.ok { background: rgba(22,184,168,.5); }
.side-foot { display: grid; gap: 6px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,.08); }
.side-search, .side-out { display: flex; align-items: center; gap: 10px; min-height: 42px; padding: 0 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,.1); background: rgba(255,255,255,.05); color: rgba(231,237,243,.85); cursor: pointer; font-size: 14px; }
.side-out { border: 0; background: none; }
.side-search span { flex: 1; text-align: left; }
kbd { font: 600 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace; padding: 4px 6px; border-radius: 6px; border: 1px solid currentColor; opacity: .6; }
.scrim { display: none; }

/* top bar */
.topbar { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 14px; padding: 12px 28px; min-height: 68px; background: color-mix(in srgb, var(--bg) 80%, transparent); -webkit-backdrop-filter: saturate(180%) blur(18px); backdrop-filter: saturate(180%) blur(18px); border-bottom: 1px solid var(--line); }
.crumb { margin-right: auto; min-width: 0; }
.crumb span { display: block; font-size: 20px; font-weight: 700; letter-spacing: -.02em; }
.crumb small { color: var(--mute); font-size: 13px; }
.top-search { display: flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--mute); cursor: pointer; font-size: 14px; }
.clock-chip { display: flex; flex-direction: column; align-items: flex-end; padding: 6px 14px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); line-height: 1.15; min-width: 120px; }
.clock-chip b { font-size: 17px; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.clock-chip small { color: var(--mute); font-size: 11.5px; white-space: nowrap; }
.menu-btn { display: none; }
.top, .tabs { display: none !important; }
main { max-width: 1320px; width: 100%; padding: 24px 28px 40px; }
.foot { max-width: 1320px; width: 100%; padding: 0 28px 110px; }

/* hero */
.hero { position: relative; overflow: hidden; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 28px; align-items: center; padding: 28px 32px; margin-bottom: 18px; border-radius: 24px; color: #fff;
  background: radial-gradient(90% 140% at 100% 0%, rgba(22,184,168,.55), transparent 55%), radial-gradient(60% 120% at 0% 100%, rgba(201,146,30,.28), transparent 60%), linear-gradient(135deg, #0F1C2B 0%, #13314A 100%); box-shadow: 0 20px 50px rgba(15,28,43,.25); }
.hero::after { content: ""; position: absolute; inset: 0; background-image: radial-gradient(rgba(255,255,255,.08) 1px, transparent 1px); background-size: 18px 18px; mask-image: linear-gradient(90deg, transparent 40%, #000); pointer-events: none; }
.hero .eyebrow { font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: #8EF0E4; font-weight: 700; }
.hero h1 { font-size: 34px; margin: 4px 0 8px; }
.hero-insight { color: rgba(255,255,255,.86); max-width: 640px; font-size: 16px; line-height: 1.5; }
.hero-insight b { color: #fff; } .hero-insight .pos { color: #6EF2B4; } .hero-insight .neg { color: #FFB4B4; }
.hero .filters { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; position: relative; z-index: 1; }
.hero .seg { background: rgba(255,255,255,.12); }
.hero .seg button { color: rgba(255,255,255,.85); }
.hero .seg button[aria-pressed="true"] { background: #fff; color: #0F1C2B; }
.hero select { background: rgba(255,255,255,.12); color: #fff; border-color: rgba(255,255,255,.2); }
.hero select option { color: #000; }
.hero-clock { position: relative; z-index: 1; display: flex; align-items: center; gap: 22px; padding: 16px 22px; border-radius: 20px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.14); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
.analog { width: 118px; height: 118px; }
.analog .face { fill: rgba(255,255,255,.06); stroke: rgba(255,255,255,.35); stroke-width: 1.2; }
.analog .tick { stroke: rgba(255,255,255,.5); stroke-width: 1.2; stroke-linecap: round; } .analog .tick.major { stroke: #fff; stroke-width: 2.2; }
.analog .hand { stroke-linecap: round; } .analog .h { stroke: #fff; stroke-width: 4; } .analog .m { stroke: #fff; stroke-width: 2.6; } .analog .s { stroke: #F0B94B; stroke-width: 1.3; transition: transform .2s cubic-bezier(.4,2.3,.6,1); }
.analog .pin { fill: #F0B94B; }
.hero-time { font-size: 46px; font-weight: 700; letter-spacing: -.03em; font-variant-numeric: tabular-nums; line-height: 1; }
.hero-time .sec { font-size: 20px; opacity: .6; margin-left: 4px; } .hero-time .ampm { font-size: 18px; margin-left: 6px; opacity: .85; font-weight: 600; }
.hero-date { margin-top: 8px; font-size: 14px; color: rgba(255,255,255,.85); } .hero-date small { color: rgba(255,255,255,.6); }

/* KPI cards */
.kpis5 { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 14px; margin-bottom: 18px; }
.kpi { position: relative; overflow: hidden; background: var(--card); border-radius: 20px; padding: 16px 18px 46px; box-shadow: var(--shadow); border: 1px solid color-mix(in srgb, var(--line) 50%, transparent); transition: transform .15s, box-shadow .15s; }
.kpi:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(0,0,0,.08); }
.kpi-top { display: flex; align-items: center; gap: 10px; }
.kpi-ic { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; }
.kpi-l { color: var(--mute); font-size: 13.5px; font-weight: 500; line-height: 1.2; }
.kpi > b { display: block; font-size: 32px; letter-spacing: -.03em; margin: 10px 0 4px; font-variant-numeric: tabular-nums; }
.kpi-bot { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.kpi-bot small { color: var(--mute); font-size: 12px; }
.spark { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 40px; }
.delta { display: inline-flex; align-items: center; gap: 2px; font-size: 12.5px; font-weight: 700; padding: 2px 8px 2px 4px; border-radius: 999px; }
.delta .ic { width: 15px; height: 15px; stroke-width: 2.6; }
.delta.up { color: #0E8A55; background: rgba(16,185,129,.12); } .delta.down { color: #C2410C; background: rgba(249,115,22,.12); } .delta.flat { color: var(--mute); background: var(--soft); padding: 2px 8px; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .delta.up { color: #4ADE80; } :root:not([data-theme="light"]) .delta.down { color: #FDBA74; } }
.tone-teal .kpi-ic { color: var(--t-teal); background: color-mix(in srgb, var(--t-teal) 14%, transparent); }
.tone-blue .kpi-ic { color: var(--t-blue); background: color-mix(in srgb, var(--t-blue) 14%, transparent); }
.tone-violet .kpi-ic { color: var(--t-violet); background: color-mix(in srgb, var(--t-violet) 14%, transparent); }
.tone-gold .kpi-ic { color: var(--t-gold); background: color-mix(in srgb, var(--t-gold) 16%, transparent); }
.tone-pink .kpi-ic { color: var(--t-pink); background: color-mix(in srgb, var(--t-pink) 14%, transparent); }

/* bento grid */
.bento { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 18px; grid-auto-flow: dense; }
.bento > .card { margin: 0 !important; border-radius: 22px; border: 1px solid color-mix(in srgb, var(--line) 50%, transparent); }
.b-actions { grid-column: span 6; } .b-kiosks { grid-column: span 3; } .b-revenue { grid-column: span 3; }
.b-activity { grid-column: span 8; } .b-notes { grid-column: span 4; }
.b-quick { grid-column: span 4; } .b-hours { grid-column: span 8; }
.b-ads, .b-recent { grid-column: span 12; } .b-top { grid-column: span 6; }
.card-head h2 { display: flex; align-items: center; gap: 8px; font-size: 18px; }
.card-head h2 .ic { color: var(--blue); }
.count { min-width: 26px; height: 26px; border-radius: 999px; background: var(--soft); display: grid; place-items: center; font-size: 13px; font-weight: 700; padding: 0 8px; }
.actions { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.actions li { display: grid; grid-template-columns: 10px 1fr auto; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 14px; background: var(--soft); }
.actions li i { width: 10px; height: 10px; border-radius: 50%; background: var(--mute); }
.actions li.tone-bad i { background: #EF4444; box-shadow: 0 0 0 4px rgba(239,68,68,.15); } .actions li.tone-warn i { background: #F59E0B; } .actions li.tone-info i { background: var(--t-blue); } .actions li.tone-idea i { background: var(--t-violet); }
.actions li p { font-size: 14.5px; line-height: 1.35; }
.all-good { display: grid; justify-items: center; text-align: center; gap: 4px; padding: 24px 0; color: var(--mute); }
.all-good .ic { width: 40px; height: 40px; padding: 8px; border-radius: 50%; background: rgba(16,185,129,.14); color: #10B981; stroke-width: 2.4; }
.all-good b { color: var(--ink); font-size: 17px; }
.k-big b { font-size: 44px; letter-spacing: -.03em; } .k-big span { color: var(--mute); margin-left: 6px; }
.k-list { list-style: none; padding: 0; margin: 8px 0 14px; display: grid; gap: 6px; }
.k-list li { display: flex; align-items: center; gap: 8px; font-size: 14px; } .k-list small { margin-left: auto; color: var(--mute); }
.dot { width: 9px; height: 9px; border-radius: 50%; } .dot.on { background: #10B981; box-shadow: 0 0 0 3px rgba(16,185,129,.18); } .dot.off { background: #EF4444; box-shadow: 0 0 0 3px rgba(239,68,68,.15); }
.b-revenue { background: linear-gradient(160deg, color-mix(in srgb, var(--t-teal) 10%, var(--card)), var(--card)) !important; }
.rev-big { font-size: 42px; font-weight: 750; letter-spacing: -.04em; } .rev-big small { font-size: 16px; color: var(--mute); font-weight: 500; margin-left: 4px; }
.pending { color: var(--t-gold); font-weight: 600; font-size: 14px; margin-top: 6px; }
.rev-bar { display: flex; gap: 3px; height: 10px; margin-top: 14px; border-radius: 6px; overflow: hidden; background: var(--soft); }
.rev-bar i { background: linear-gradient(90deg, var(--t-teal), var(--t-blue)); }
.rev-bar i:nth-child(2n) { background: linear-gradient(90deg, var(--t-violet), var(--t-pink)); }
.qa { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.qa button { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; padding: 14px; min-height: 92px; border-radius: 16px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; text-align: left; font-size: 14px; font-weight: 600; transition: transform .12s, border-color .12s, background .12s; }
.qa button:hover { transform: translateY(-2px); border-color: var(--t-teal); background: color-mix(in srgb, var(--t-teal) 6%, var(--card)); }
.qa .ic { width: 22px; height: 22px; color: var(--t-teal); }
.rank { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 7px; background: var(--soft); font-size: 12px; font-weight: 700; margin-right: 8px; color: var(--mute); }
.feed { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 10px; }
.feed li { display: flex; gap: 10px; align-items: center; padding: 8px 12px; border-radius: 14px; background: var(--soft); flex: 1 1 220px; }
.feed .v { font: 700 12px/1 ui-monospace, monospace; padding: 6px 7px; border-radius: 8px; background: var(--card); color: var(--blue); }
.feed p { font-size: 14px; } .feed small { display: block; color: var(--mute); font-size: 12px; }

/* notes */
.quick-note { display: flex; gap: 8px; margin-bottom: 12px; }
.quick-note input { flex: 1; min-height: 40px; }
.quick-note .btn { min-width: 44px; padding: 0 12px; }
.mini-notes { display: grid; gap: 8px; }
.note { position: relative; border-radius: 14px; padding: 12px 14px 10px; color: #2B2B2B; box-shadow: 0 1px 0 rgba(0,0,0,.04), 0 6px 16px rgba(0,0,0,.06); break-inside: avoid; display: grid; grid-template-columns: auto 1fr; gap: 0 10px; }
.note .note-text { grid-column: 2; white-space: pre-wrap; word-break: break-word; font-size: 15px; line-height: 1.45; outline: none; min-height: 1.4em; }
.note:not(:has(.note-check)) .note-text, .note:not(:has(.note-check)) footer { grid-column: 1 / -1; }
.note footer { grid-column: 2; display: flex; align-items: center; gap: 6px; margin-top: 8px; color: rgba(0,0,0,.5); font-size: 12px; flex-wrap: wrap; }
.note-tools { margin-left: auto; display: flex; gap: 4px; align-items: center; opacity: .35; transition: opacity .15s; }
.note:hover .note-tools, .note:focus-within .note-tools { opacity: 1; }
.note-check { width: 24px; height: 24px; border-radius: 8px; border: 2px solid rgba(0,0,0,.35); background: rgba(255,255,255,.6); display: grid; place-items: center; cursor: pointer; padding: 0; margin-top: 1px; }
.note-check .ic { width: 16px; height: 16px; stroke-width: 3; color: #fff; }
.note.done .note-check { background: #10B981; border-color: #10B981; }
.note.done .note-text { text-decoration: line-through; opacity: .55; }
.note.pinned { box-shadow: 0 0 0 2px rgba(0,0,0,.08), 0 8px 20px rgba(0,0,0,.08); }
.pin-tag .ic { width: 14px; height: 14px; }
.icon-btn.sm { width: 30px; height: 30px; border: 0; background: rgba(255,255,255,.55); }
.icon-btn.sm .ic { width: 16px; height: 16px; color: #333; }
.c-yellow { background: #FFF3B0; } .c-teal { background: #C9F2EC; } .c-pink { background: #FFD6E5; } .c-blue { background: #D8E6FF; } .c-gray { background: #E9ECF0; }
.sw { width: 20px; height: 20px; border-radius: 50%; border: 2px solid rgba(0,0,0,.15); cursor: pointer; padding: 0; position: relative; }
.sw.on, .sw:has(input:checked) { border-color: #333; box-shadow: 0 0 0 2px #fff inset; }
.sw input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
.sws { display: flex; gap: 8px; align-items: center; }
.note-new { display: grid; gap: 10px; }
.note-new textarea { min-height: 70px; }
.note-new-bar { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.note-new-bar .grow { flex: 1; }
.notes-bar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin: 18px 0 14px; }
.notes-bar input { max-width: 280px; }
.board { columns: 3 280px; column-gap: 14px; }
.board .note { margin-bottom: 14px; }
.board .note:hover { transform: rotate(-.4deg); }

/* command palette */
.pal { position: fixed; inset: 0; z-index: 60; display: grid; justify-items: center; align-items: start; padding: 12vh 16px 16px; background: rgba(10,14,19,.45); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); }
.pal[hidden] { display: none; }
.pal-box { width: min(640px, 100%); background: var(--card); border-radius: 18px; box-shadow: 0 30px 80px rgba(0,0,0,.35); overflow: hidden; border: 1px solid var(--line); }
.pal-in { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.pal-in input { border: 0 !important; box-shadow: none !important; padding: 8px 0; font-size: 17px; background: none; }
.pal-list { list-style: none; margin: 0; padding: 6px; max-height: 52vh; overflow-y: auto; }
.pal-g { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--mute); padding: 10px 10px 4px; }
.pal-it { display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 10px; cursor: pointer; font-size: 15px; }
.pal-it small { margin-left: auto; color: var(--mute); font-size: 13px; }
.pal-it.sel, .pal-it:hover { background: color-mix(in srgb, var(--t-teal) 14%, transparent); }
.pal-it .ic { color: var(--t-teal); }
.pal-empty { padding: 20px; text-align: center; color: var(--mute); }

/* responsive */
@media (min-width: 901px) { .publish-bar { left: calc(50% + var(--side) / 2); } }
@media (max-width: 1180px) { .kpis5 { grid-template-columns: repeat(3, minmax(0, 1fr)); } .b-actions { grid-column: span 12; } .b-kiosks, .b-revenue { grid-column: span 6; } .b-activity, .b-hours { grid-column: span 12; } .b-notes, .b-quick { grid-column: span 6; } }
@media (max-width: 900px) {
  .shell { grid-template-columns: 1fr; }
  .side { position: fixed; left: 0; top: 0; bottom: 0; width: 280px; transform: translateX(-102%); transition: transform .25s cubic-bezier(.2,.8,.2,1); }
  body.menu-open .side { transform: none; }
  body.menu-open .scrim { display: block; position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 35; }
  .menu-btn { display: inline-grid; }
  .topbar { padding: 10px 16px; gap: 10px; }
  .top-search span, .top-search kbd { display: none; }
  main { padding: 18px 16px 40px; } .foot { padding: 0 16px 110px; }
  .hero { grid-template-columns: 1fr; padding: 22px; }
  .hero-clock { justify-content: flex-start; }

/* ================= v6: kiosk theme (Metro tiles + AeroAssist gold) =================
   Same look as the guest kiosk: deep navy, square tiles, cut-corner metal buttons,
   brushed-gold for the primary action and the current page. Always dark, like the kiosk. */
:root, :root:not([data-theme="light"]) {
  --bg: #0B1622; --card: #122234; --soft: #1A2C41; --line: rgba(166,246,239,.16);
  --ink: #F4F7FA; --ink2: #D5DEE8; --mute: #93A3B5;
  --blue: #7EEBDD; --blue-ink: #06201C; --teal: #7EEBDD; --gold: #D9B76E; --gold-2: #F0D9A4;
  --green: #4ADE80; --red: #FF7B7B; --amber: #F5C46B;
  --t-teal: #2FD4C3; --t-blue: #6EA0FF; --t-violet: #A98BFF; --t-gold: #E8C97E; --t-pink: #FF7AAA;
  --shadow: none; --r: 3px; color-scheme: dark;
  --goldgrad: linear-gradient(100deg, #7E5E22 0%, #D9B866 14%, #FFF2CC 27%, #C99A45 44%, #F3DC9F 62%, #9A7432 82%, #E8C97E 100%);
  --metal: linear-gradient(180deg, #2A3A4E 0%, #172535 55%, #0E1823 100%);
  --cut: polygon(9px 0, 100% 0, 100% calc(100% - 9px), calc(100% - 9px) 100%, 0 100%, 0 9px);
  --cut-s: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px);
}
html, body { background: var(--bg); }
body { background: radial-gradient(1200px 600px at 100% -10%, rgba(47,212,195,.10), transparent 60%), radial-gradient(900px 500px at -10% 110%, rgba(217,183,110,.08), transparent 60%), var(--bg); background-attachment: fixed; }
.logo .on-light { display: none !important; } .logo .on-dark { display: block !important; }

/* square everything */
.card, .kpi, .bento > .card, .hero, .hero-clock, .item, .login-card, .logo-box, .photo, .note, .toast, .pal-box, .actions li, .feed li, .qa button,
.clock-chip, .top-search, .side-venue, .side-search, .msg, .publish-bar, .chip, .count, .rank, .feed .v, .kpi-ic, .bar, .bar i, .rev-bar, .legend i { border-radius: var(--r) !important; }
.card { background: linear-gradient(180deg, rgba(255,255,255,.035), rgba(255,255,255,0)) , var(--card); border: 1px solid var(--line); }
.bento > .card { border-color: var(--line); }
.item { border-color: var(--line); background: var(--card); } .item.open { border-color: rgba(217,183,110,.5); }
.item-body, .item-actions, .list li, td, .login-foot { border-color: rgba(255,255,255,.07); }
th { border-color: var(--line); text-transform: uppercase; letter-spacing: .12em; font-size: 11px; font-weight: 700; }
tr:hover td { background: rgba(126,235,221,.04); }

h1, .crumb span { font-weight: 300; letter-spacing: -.02em; }

/* inputs: square, dark, gold focus */
input[type=text], input[type=url], input[type=email], input[type=tel], input[type=number], input[type=search], input[type=password], input[type=date], select, textarea {
  border-radius: var(--r) !important; background: #0D1A28 !important; border: 1px solid rgba(255,255,255,.14) !important; color: var(--ink) !important; color-scheme: dark; }

.btn, .icon-btn:not(.sm), .seg, .qa button { clip-path: var(--cut-s); }
.btn { border-radius: 0 !important; border: 0 !important; background: var(--metal) !important; color: #E8F6F4 !important;
  box-shadow: inset 0 0 0 1px rgba(166,246,239,.30), inset 0 1px 0 rgba(255,255,255,.10);
  text-transform: uppercase; letter-spacing: .08em; font-size: 13px; font-weight: 700; position: relative; overflow: hidden; transition: filter .15s, transform .08s; }

.btn.primary:hover::after { left: 130%; }
