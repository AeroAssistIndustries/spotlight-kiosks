<title>CityPulse Sales Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: call-center console. Navy sidebar (role-grouped nav) + sticky status bar (agent state, search, next call) + workspace. On phones the sidebar becomes a scrolling top strip. */
:root{
  --navy:#0F1C2B; --navy-2:#1A2B3F; --navy-3:#2E4560; --teal:#22C7B6; --teal-deep:#13A797; --teal-ink:#0E6B63; --signal:#FF6B4A;
  --bg:#F4F6F7; --surface:#FFFFFF; --surface-2:#EDF1F3; --fg:#121B26; --muted:#536170; --line:#D5DCE2;
  --chip-bg:#E4E9EC; --teal-soft:#DDF5F1; --amber:#A96A12; --amber-soft:#FDF1DC; --green:#1F7F47; --green-soft:#DFF3E6;
  --red:#B8391F; --red-soft:#FCE5DF; --blue:#3E5C7A; --blue-soft:#E2EAF2; --violet:#5B4BB7; --violet-soft:#E9E6F8;
  --side:#0F1C2B; --side-fg:#F4F6F7; --side-muted:#93A4B6;
  --display:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;
  --body:"Instrument Sans","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1622; --surface:#132131; --surface-2:#1A2B3F; --fg:#E8EEF2; --muted:#93A4B6; --line:#26384C;
  --chip-bg:#22344A; --teal-soft:#123A3A; --teal-ink:#5FE0D2; --amber:#F2B65A; --amber-soft:#3A2D16; --green:#5FD08E; --green-soft:#16362A;
  --red:#FF8A70; --red-soft:#3D1F1A; --blue:#9DB8D6; --blue-soft:#1E3047; --violet:#B3A8F2; --violet-soft:#2A2550;
  --side:#08111B; --side-fg:#F4F6F7; --side-muted:#8193A6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1622; --surface:#132131; --surface-2:#1A2B3F; --fg:#E8EEF2; --muted:#93A4B6; --line:#26384C;
  --chip-bg:#22344A; --teal-soft:#123A3A; --teal-ink:#5FE0D2; --amber:#F2B65A; --amber-soft:#3A2D16; --green:#5FD08E; --green-soft:#16362A;
  --red:#FF8A70; --red-soft:#3D1F1A; --blue:#9DB8D6; --blue-soft:#1E3047; --violet:#B3A8F2; --violet-soft:#2A2550;
  --side:#08111B; --side-fg:#F4F6F7; --side-muted:#8193A6; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:400 14.5px/1.5 var(--body);margin:0}
h1,h2,h3,h4{font-family:var(--display);margin:0;letter-spacing:-.015em;line-height:1.1;text-wrap:balance}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px;border-radius:6px}

/* shell */
.app{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:100%}
.side{background:var(--side);color:var(--side-fg);position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow-y:auto;padding:16px 12px 24px;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand svg{width:38px;height:33px;flex:none}
.brand b{display:block;font:800 17px/1 var(--display)}
.brand small{display:block;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--teal);font-weight:700;margin-top:3px}
.navgroup{display:grid;gap:2px}
.navgroup .lab{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--side-muted);font-weight:700;padding:0 10px 4px}
.navgroup button{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;background:none;border:0;color:var(--side-muted);text-align:left;padding:8px 10px;border-radius:8px;font-weight:600;cursor:pointer}
.navgroup button:hover{color:var(--side-fg);background:rgba(255,255,255,.05)}
.navgroup button[aria-current="true"]{background:var(--teal);color:#0F1C2B}
.badge{min-width:20px;padding:1px 6px;border-radius:999px;background:var(--signal);color:#fff;font-size:11px;font-weight:700;text-align:center}
.navgroup button[aria-current="true"] .badge{background:#0F1C2B}
.side-foot{margin-top:auto;font-size:12px;color:var(--side-muted);padding:0 8px}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding:10px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top .search{flex:1 1 220px;min-width:0;position:relative}
.top .search input{width:100%;padding-left:34px}
.top .search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
.results{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 30px rgba(15,28,43,.18);max-height:340px;overflow:auto;z-index:30}
.results button{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:9px 12px;cursor:pointer}
.results button:hover,.results button:focus{background:var(--surface-2)}
.state-pill{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:999px;padding:3px 10px 3px 10px}
.state-pill select{border:0;background:transparent;padding:4px 2px;font-weight:700;width:auto}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}
.dot.available{background:var(--green)} .dot.oncall{background:var(--signal)} .dot.wrap{background:var(--amber)} .dot.break,.dot.lunch,.dot.training{background:var(--blue)} .dot.offline{background:var(--muted)}
.clock{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted)}
.bell{position:relative}
.view{padding:20px;max-width:1440px;width:100%;margin:0 auto}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:static;height:auto;flex-direction:row;overflow-x:auto;padding:10px 12px;gap:12px;align-items:center}
  .navgroup{display:flex;gap:2px}
  .navgroup .lab,.side-foot{display:none}
  .navgroup button{white-space:nowrap}
  .brand small{display:none}
  .top{padding:10px 16px}
  .view{padding:16px}
}

/* primitives */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;min-width:0}
.pad{padding:16px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.stack{display:grid;gap:12px;min-width:0}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.eyebrow{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.hd{display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.hd h1{font-size:clamp(24px,3vw,34px)}
.card-t{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.card-t h3{font-size:16.5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1.5px solid var(--line);background:var(--surface);padding:7px 13px;border-radius:999px;font-weight:600;cursor:pointer;white-space:nowrap;font-size:13.5px;text-decoration:none;color:var(--fg)}
.btn:hover{border-color:var(--teal-deep)}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#0F1C2B}
.btn.primary:hover{background:var(--teal-deep);border-color:var(--teal-deep)}
.btn.danger{background:var(--signal);border-color:var(--signal);color:#fff}
.btn.ghost{background:transparent}
.btn.sm{padding:4px 10px;font-size:12.5px}
.btn.lg{padding:12px 20px;font-size:15.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
label.f{display:grid;gap:4px;font-size:12px;font-weight:600;color:var(--muted);min-width:0}
input[type=text],input[type=email],input[type=url],input[type=number],input[type=date],input[type=datetime-local],input[type=tel],input[type=search],select,textarea{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;font-size:14px;min-width:0}
textarea{resize:vertical;min-height:64px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--teal-deep)}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--teal-deep)}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:640px){.g2,.g3,.g4{grid-template-columns:minmax(0,1fr)}}
.cols{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px;align-items:start}
.cols-3{display:grid;grid-template-columns:minmax(260px,320px) minmax(0,1fr) minmax(240px,320px);gap:16px;align-items:start}
@media (max-width:1240px){.cols-3{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.cols-3>:last-child{grid-column:1/-1}}
@media (max-width:1000px){.cols,.cols-3{grid-template-columns:minmax(0,1fr)}}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:999px;padding:2px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:4px 11px;border-radius:999px;font-weight:600;font-size:12.5px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--navy);color:#F4F6F7}
.notice{background:var(--amber-soft);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:13.5px}
.notice.red{background:var(--red-soft)}
.notice.teal{background:var(--teal-soft)}
.empty{padding:24px 12px;text-align:center;color:var(--muted);font-size:13.5px}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;letter-spacing:.02em;padding:2px 8px;border-radius:999px;background:var(--chip-bg);color:var(--fg);white-space:nowrap}
.chip.dotted::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.85}
.c-blue{background:var(--blue-soft);color:var(--blue)} .c-gray{background:var(--chip-bg);color:var(--muted)} .c-amber{background:var(--amber-soft);color:var(--amber)}
.c-teal{background:var(--teal-soft);color:var(--teal-ink)} .c-violet{background:var(--violet-soft);color:var(--violet)} .c-green{background:var(--green-soft);color:var(--green)} .c-red{background:var(--red-soft);color:var(--red)}

.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right}
tbody tr:last-child td{border-bottom:0}
tr.click{cursor:pointer} tr.click:hover td{background:var(--surface-2)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.kpi{background:var(--surface);padding:12px 14px;min-width:0}
.kpi b{display:block;font:800 24px/1.15 var(--display);font-variant-numeric:tabular-nums;margin-top:3px}
.kpi span{font-size:12px;color:var(--muted)}
.meter{height:6px;border-radius:999px;background:var(--surface-2);overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--teal);border-radius:999px}
.list{list-style:none;margin:0;padding:0}
.list>li{border-top:1px solid var(--line)}
.list>li:first-child{border-top:0}
.li-btn{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;width:100%;text-align:left;background:none;border:0;padding:10px 14px;cursor:pointer}
.li-btn:hover{background:var(--surface-2)}
.li-btn .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li-btn .m{font-size:12px;color:var(--muted);grid-column:1}
.li-btn .r{grid-row:1/span 2;grid-column:2;display:grid;justify-items:end;gap:3px;align-content:center}

/* dialer */
.dial-card{background:var(--navy);color:#F4F6F7;border-radius:16px;padding:18px;display:grid;gap:12px}
.dial-card .muted{color:#B5C2CF}
.dial-card h2{font-size:clamp(24px,2.6vw,32px)}
.phone-big{font:800 clamp(26px,3vw,34px)/1 var(--display);font-variant-numeric:tabular-nums;letter-spacing:.01em;user-select:all}
.timer{font:800 40px/1 var(--display);font-variant-numeric:tabular-nums}
.timer.live{color:var(--signal)}
.dial-card .btn{border-color:var(--navy-3);background:var(--navy-2);color:#F4F6F7}
.dial-card .btn.primary{background:var(--teal);border-color:var(--teal);color:#0F1C2B}
.dial-card .btn.danger{background:var(--signal);border-color:var(--signal);color:#fff}
.dial-card kbd{color:inherit;border-color:currentColor;opacity:.7}
.localtime{display:inline-flex;gap:6px;align-items:center;font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--navy-2)}
.localtime.bad{background:var(--signal);color:#fff}
.dispos{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:6px}
.dispos button{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;text-align:left;cursor:pointer;font-weight:600;font-size:13px;display:flex;justify-content:space-between;gap:6px}
.dispos button[aria-pressed="true"]{border-color:var(--teal-deep);background:var(--teal-soft)}
.dispos button.neg[aria-pressed="true"]{border-color:var(--signal);background:var(--red-soft)}
.script{white-space:pre-line;font-size:14.5px;line-height:1.6;background:var(--surface-2);border-radius:10px;padding:14px;border-left:4px solid var(--teal)}
.script b{color:var(--teal-ink)}
.ans{font-size:13.5px;background:var(--surface-2);border-radius:10px;padding:10px 12px}
.rule{font-size:11.5px;color:var(--muted)}
.timeline{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.timeline li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;font-size:13.5px}
.tl-dot{width:28px;height:28px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--muted)}
.tl-meta{font-size:11.5px;color:var(--muted)}
.contacts{display:grid;gap:8px}
.contact{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:4px}
.avatar{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:11px;color:#0F1C2B;background:var(--teal);flex:none;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}

/* wallboard */
.agents{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.agent{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px;border-top:4px solid var(--muted)}
.agent.available{border-top-color:var(--green)} .agent.oncall{border-top-color:var(--signal)} .agent.wrap{border-top-color:var(--amber)} .agent.break,.agent.lunch,.agent.training{border-top-color:var(--blue)}
.agent .nums{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;text-align:center}
.agent .nums b{display:block;font:800 18px/1.1 var(--display);font-variant-numeric:tabular-nums}
.agent .nums span{font-size:10.5px;color:var(--muted)}

/* pipeline board */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,1fr);gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--surface-2);border-radius:12px;padding:10px;display:grid;gap:8px;align-content:start;min-height:120px}
.col h4{font-size:13px;display:flex;justify-content:space-between;gap:6px}
.deal{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;gap:4px;cursor:pointer;text-align:left}
.deal:hover{border-color:var(--teal-deep)}

/* charts */
.bars{display:grid;grid-template-columns:repeat(24,minmax(0,1fr));gap:3px;align-items:end;height:140px;border-bottom:1px solid var(--line)}
.bars div{background:var(--teal);border-radius:3px 3px 0 0;min-height:1px}
.bars-x{display:grid;grid-template-columns:repeat(24,minmax(0,1fr));gap:3px;font-size:10px;color:var(--muted);text-align:center;margin-top:4px}
.hbar{display:grid;grid-template-columns:130px minmax(0,1fr) 56px;gap:10px;align-items:center;font-size:13px}
.hbar .tr{height:16px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.hbar .tr i{display:block;height:100%;background:var(--teal);border-radius:4px}

/* quote */
.receipt{background:var(--navy);color:#F4F6F7;border-radius:14px;padding:18px;display:grid;gap:10px}
.receipt .big{font:800 40px/1 var(--display);font-variant-numeric:tabular-nums}
.receipt .line{display:flex;justify-content:space-between;gap:12px;border-top:1px dashed var(--navy-3);padding-top:9px;font-size:13.5px}
.receipt .line span:first-child{color:#B5C2CF}
.receipt pre{white-space:pre-wrap;font:inherit;font-size:13px;background:var(--navy-2);border-radius:10px;padding:12px;margin:0}
.tier{border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface)}
.tier b{display:block;font:800 20px/1.1 var(--display)}
.tier.on{border-color:var(--teal);background:var(--teal-soft)}

.ann{border-left:4px solid var(--teal);padding:10px 12px;background:var(--surface-2);border-radius:0 10px 10px 0;display:grid;gap:4px}
.ann.pinned{border-left-color:var(--signal)}
.kb{white-space:pre-line;font-size:14px;line-height:1.6}
.score{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#F4F6F7;padding:10px 16px;border-radius:999px;font-weight:600;font-size:13.5px;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:calc(100% - 32px)}
kbd{font:600 11px var(--body);border:1px solid var(--line);border-radius:4px;padding:0 4px;color:var(--muted)}
details>summary{cursor:pointer;font-weight:600}
@media (prefers-reduced-motion:no-preference){.meter i,.hbar .tr i,.bars div{transition:width .3s ease,height .3s ease}}
</style>

<div class="app">
  <aside class="side" aria-label="Sales Studio navigation">
    <div class="brand">
      <svg viewBox="0 0 128 112" aria-hidden="true"><path d="M6 88 H30 L38 66 L48 108 L57 56 L64 88 H78" fill="none" stroke="#22C7B6" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><g fill="#F4F6F7"><rect x="80" y="14" width="40" height="56" rx="7"/><rect x="94" y="68" width="12" height="22" rx="2"/><rect x="78" y="86" width="44" height="9" rx="4.5"/></g><rect x="86" y="20" width="28" height="40" rx="3" fill="#22C7B6"/><path d="M91 48 H97 L100 41 L104 53 L107 48 H110" fill="none" stroke="#0F1C2B" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div><b>CityPulse</b><small>Sales Studio</small></div>
    </div>
    <nav id="nav" style="display:contents"></nav>
    <div class="side-foot" id="sideFoot"></div>
  </aside>
  <div class="main">
    <div class="top">
      <div class="state-pill" title="Your status"><span class="dot" id="stDot"></span><label class="sr" for="stateSel">Your status</label><select id="stateSel"></select><span class="clock" id="stClock">0:00</span></div>
      <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><label class="sr" for="gSearch">Search accounts</label><input id="gSearch" type="search" placeholder="Search business, phone or contact" autocomplete="off"><div class="results" id="gResults" hidden></div></div>
      <button class="btn" id="inboundBtn" type="button">Log inbound call</button>
      <button class="btn bell" id="bellBtn" type="button">Callbacks <span class="badge" id="bellCount" hidden>0</span></button>
      <button class="btn primary" id="nextCallBtn" type="button">Next call →</button>
    </div>
    <div class="view" id="noticeWrap" style="padding-bottom:0" hidden><div class="notice" id="notice"></div></div>
    <main class="view" id="view"></main>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
'use strict';
/* ========================= Utilities ========================= */

function dialHref(phone){
  const e164=normPhone(phone), d10=e164.length===11?e164.slice(1):e164;
  const m=pref('dialMethod');
  if(m==='browser') return '#';
  if(m==='callto') return `callto:+${e164}`;
  if(m==='ringcentral') return `rcmobile://call?number=${e164}`;
  if(m==='custom' && pref('dialTemplate')) return String(pref('dialTemplate')).replace(/\{e164\}/g,'+'+e164).replace(/\{digits\}/g,e164).replace(/\{phone10\}/g,d10);
  return `tel:+${e164}`;
}
function emailHref(to, subject, body){
  const m=pref('emailMethod'), e=encodeURIComponent;
  if(m==='gmail') return `https://mail.google.com/mail/?view=cm&fs=1&to=${e(to||'')}&su=${e(subject||'')}&body=${e(body||'')}`;
  if(m==='outlook') return `https://outlook.office.com/mail/deeplink/compose?to=${e(to||'')}&subject=${e(subject||'')}&body=${e(body||'')}`;
  return `mailto:${e(to||'')}?subject=${e(subject||'')}&body=${e(body||'')}`;
}
const emailLabel = () => ({gmail:'Open in Gmail', outlook:'Open in Outlook', mailto:'Open in mail app'})[pref('emailMethod')] || 'Open in email';
function calHref(title, startIso, details){
  const m=pref('calendarMethod'); if(m==='none' || !startIso) return '';
  const s=new Date(startIso), en=new Date(s.getTime()+15*60e3), e=encodeURIComponent;
  if(m==='outlook') return `https://outlook.office.com/calendar/deeplink/compose?subject=${e(title)}&startdt=${e(s.toISOString())}&enddt=${e(en.toISOString())}&body=${e(details||'')}`;
  const g=d=>d.toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');
  return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${e(title)}&dates=${g(s)}/${g(en)}&details=${e(details||'')}`;
}

function priceFor(n, billing){
  n = Math.max(1, Math.floor(Number(n)||1));
  if (billing === 'monthly') return {n, billing, monthly:60*n, annual:720*n, label:`${n} location${n>1?'s':''}, monthly`, note:'$60 per location per month.'};
  let annual, label, note='';
  if (n === 1){ annual = 399; label = '1 location'; }
  else if (n === 2){ annual = 798; label = '2 single locations'; note = 'Two single-location ads at $399 each. The 3-location package is $1,099.'; }
  else if (n === 3){ annual = 1099; label = '3-location package'; }
  else if (n === 4){ annual = 1200; label = '5-location package'; note = 'Four single locations cost more than the 5-location package, so this quotes the package with one location to spare.'; }
  else { annual = 1200 + 300*(n-5); label = n === 5 ? '5-location package' : `5-location package + ${n-5} more`; if(n>5) note = '$300 per year for each location after 5.'; }
  return {n, billing, annual, monthly:null, label, note};
}

function leadState(l){

async function guard(fn, okMsg){
  if(!db){ toast('Saving isn’t available in this view.'); return false; }
  if(!S.canWrite){ toast('You have view-only access. Ask an admin for edit access.'); return false; }
  try{ await fn(); if(okMsg) toast(okMsg); return true; }
  catch(e){
    console.error(e);
    if(e && e.code==='invalid_argument') toast('That change wasn’t saved. Your access level may not allow it.');
    else if(e && e.code==='quota_exceeded') toast('Storage is full. Archive old records to add more.');
    else if(e && e.code==='resource_exhausted') toast('Too many changes at once. Wait a moment and try again.');
    else toast('Couldn’t save. Check your connection and try again.');
    return false;
  }
}

  return {dials:a.length, connects:a.filter(x=>x.connect).length, talk:a.reduce((s,x)=>s+(Number(x.durationSec)||0),0), won:a.filter(x=>x.disposition==='Won').length, interested:a.filter(x=>x.disposition==='Interested').length};
}

/* ========================= DIALER ========================= */
function queueFor(){
  const now=Date.now(), max=Number(cfg('maxAttempts')), D=S.dial;
  const cands = leadsArr().filter(l=>{
    if(!OPEN.has(l.status) || !l.phone || isDnc(l)) return false;
    if(l.rep && l.rep!==S.me.id) return false;
    if(!l.rep && !cfg('allowUnassigned')) return false;
    if(D.campaign && l.campaignId!==D.campaign) return false;
    if(D.host && l.hostId!==D.host) return false;
    if(l.nextCallAt && new Date(l.nextCallAt).getTime()>now+5*60e3) return false;
    if((Number(l.attempts)||0) >= max && !['Interested','Proposal sent','Follow up'].includes(l.status)) return false;
    if(!D.override && !localInfo(l).ok) return false;
    return true;
  });
  const cbDue = new Map([...S.tasks.values()].filter(t=>!t.done && t.assignee===S.me.id && t.leadId && t.due && new Date(t.due).getTime()<=now+5*60e3).map(t=>[t.leadId,t]));
  const rank = l => {
    if(cbDue.has(l.id)) return [0, cbDue.get(l.id).due];
    if(['Interested','Proposal sent'].includes(l.status)) return [1, l.nextCallAt||''];
    if(l.status==='Follow up') return [2, l.nextCallAt||''];
    if(l.status==='New') return [3, String(Number(l.distance??99).toFixed(2)).padStart(7,'0')];
    return [4, String(Number(l.attempts)||0).padStart(3,'0') + (l.lastCallAt||'')];
  };
  return cands.sort((a,b)=>{ const x=rank(a), y=rank(b); return x[0]-y[0] || String(x[1]).localeCompare(String(y[1])); });
}
/* A short hold while an agent looks at a lead, a long one once the call starts. Holds lapse on their own. */
async function lockLead(id, ttl){
  if(!db || !S.me.id) return true;
  try{ const r = await db.doc('locks/'+id).acquire({holder:S.me.id, ttlMs:ttl||180000}); return !!r.acquired; }catch(e){ return true; }
}
setInterval(()=>{ if(S.dial.leadId && S.view==='dialer') lockLead(S.dial.leadId, S.dial.phase==='oncall'?1800000:180000); }, 120000);
async function loadNext(skipId){
  const q = queueFor().filter(l=>l.id!==skipId && l.id!==S.dial.leadId);
  for(const l of q.slice(0,12)){
    if(await lockLead(l.id)){ Object.assign(S.dial,{leadId:l.id, phase:'ready', dispo:'', callSec:0}); render(); return; }
  }
  Object.assign(S.dial,{leadId:'', phase:'idle', dispo:''}); render();
  toast(q.length ? 'Everyone in this queue is being worked by a teammate.' : 'No calls waiting in this queue right now.');
}
async function dialLead(id){
  if(S.dial.phase==='oncall'){ toast('Finish the current call first.'); go('dialer'); return; }
  if(!(await lockLead(id))){ toast('A teammate is working this account right now.'); return; }
  Object.assign(S.dial,{leadId:id, phase:'ready', dispo:'', callSec:0}); go('dialer');
}

  if(!h) return 'I’m reaching out about advertising on a CityPulse kiosk near you.';

}

  ids.forEach(i=>{ const el=$(i); if(el && vals[i]!==undefined) el.value=vals[i]; });
}
let outsideOk='';
function startCall(){
  const l=S.leads.get(S.dial.leadId); if(!l) return false;
  if(isDnc(l)){ toast('This number is on the do-not-call list.'); return false; }
  if(!localInfo(l).ok && outsideOk!==l.id){ outsideOk=l.id; toast('It’s outside calling hours for this business. Press Start call again only if they asked you to call now.'); return false; }
  Object.assign(S.dial,{phase:'oncall', callStart:Date.now()});
  setMyState('oncall', {leadId:l.id});
  lockLead(l.id, 1800000);
  if(browserCalling()){
    S.dial.callSid=''; S.dial.muted=false; S.dial.direction='outbound';
    HOST.voice.call('+'+normPhone(l.phone), {
      onAccept: sid=>{ S.dial.callSid=sid||''; },
      onEnd: ()=>{ if(S.dial.phase==='oncall') endCall(); },
      onError: msg=>{ toast(msg||'The call didn’t go through.'); if(S.dial.phase==='oncall') endCall(); }
    });
  }
  keepWrap(()=>render());
  return true;
}
function endCall(){
  if(S.dial.phase!=='oncall') return;
  if(HOST && HOST.voice && HOST.voice.active()) HOST.voice.hangup();
  S.dial.callSec=(Date.now()-S.dial.callStart)/1000; S.dial.phase='wrap';
  setMyState('wrap');
  keepWrap(()=>render());
}
function pickDispo(k){
  S.dial.dispo=k;
  if(S.dial.phase==='oncall') endCall();
  document.querySelectorAll('[data-dispo]').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.dispo===k)));
  ['wSave','wStay'].forEach(id=>{ const el=$(id); if(el) el.disabled=false; });
  const d=DISPO_MAP[k], cb=$('wCallback');
  if(cb && !cb.value && (d.task || d.needsTime)){ const t=new Date(Date.now()+(d.retryH||24)*3600e3); t.setHours(10,0,0,0); cb.value=toLocalInput(t); }
}
function setCallbackPreset(v){
  let d=new Date();
  if(v==='h2') d=new Date(Date.now()+2*3600e3);
  else if(v==='t10'){ d.setDate(d.getDate()+1); d.setHours(10,0,0,0); }
  else { d.setDate(d.getDate()+Number(v)); d.setHours(10,0,0,0); }
  $('wCallback').value = toLocalInput(d);
}
async function saveWrap(next){
  const D=S.dial, l=S.leads.get(D.leadId); if(!l) return;
  const d=DISPO_MAP[D.dispo]; if(!d){ toast('Pick an outcome first.'); return; }
  if(D.phase==='oncall') endCall();
  const note=$('wNote').value.trim(), spoke=$('wContact').value.trim(), cbVal=$('wCallback').value;
  const p=priceFor($('wLocs').value, $('wBill').value);
  if(d.needsTime && !cbVal){ toast('Set a callback time.'); $('wCallback').focus(); return; }
  const cbIso = cbVal ? new Date(cbVal).toISOString() : '';
  const talk = Math.round(D.callSec||0);
  const ok = await guard(async ()=>{
    await logAct({leadId:l.id, type:'call', direction:D.direction||'outbound', disposition:d.k, outcome:d.k, connect:!!d.connect, durationSec:talk, callSid:D.callSid||'', note:[spoke?`Spoke with ${spoke}.`:'', note].filter(Boolean).join(' '), campaignId:l.campaignId||'', hostId:l.hostId||''});
    const patch={status:d.status, attempts:(Number(l.attempts)||0)+1, lastCallAt:nowIso(), lastDisposition:d.k, locations:p.n, billing:p.billing, value:p.annual};
    if(!l.rep && S.me.id) patch.rep=S.me.id;
    patch.nextCallAt = cbIso || (d.retryH ? new Date(Date.now()+d.retryH*3600e3).toISOString() : '');
    patch.followUp = OPEN.has(d.status) && patch.nextCallAt ? patch.nextCallAt.slice(0,10) : '';
    if(spoke){ const [nm,...rest]=spoke.split(','); const cs=(l.contacts||[]).slice(); if(!cs.some(c=>(c.name||'').toLowerCase()===nm.trim().toLowerCase())){ cs.push({id:newId(), name:nm.trim(), title:rest.join(',').trim(), phone:'', email:'', bestTime:'', decisionMaker:false}); patch.contacts=cs; } }
    await patchLead(l.id, patch);
    for(const t of [...S.tasks.values()]){ if(!t.done && t.leadId===l.id && t.assignee===S.me.id && t.type==='callback') await db.doc('tasks/'+t.id).update({done:true, doneAt:nowIso()}); }
    if(cbIso || d.task){ await setDoc('tasks/'+newId(), {leadId:l.id, assignee:S.me.id, type:'callback', title:`${d.k==='Callback set'?'Callback':'Follow up'}: ${l.name}`, due:cbIso||patch.nextCallAt, done:false, createdAt:nowIso(), createdBy:S.me.id}); }
    if(d.dnc && normPhone(l.phone)) await setDoc('dnc/'+normPhone(l.phone), {phone:l.phone, name:l.name, reason:'Asked not to be called', at:nowIso(), by:S.me.id});
    if(d.order){
      const ex=[...S.orders.values()].find(o=>o.leadId===l.id && o.stage!=='Cancelled');
      if(ex) await db.doc('orders/'+ex.id).update(stamp({stage: d.order==='Signed' && ex.stage==='Proposal sent' ? 'Signed' : ex.stage, locations:p.n, billing:p.billing, annual:p.annual}));
      else await setDoc('orders/'+newId(), stamp({leadId:l.id, name:l.name, repId:l.rep||S.me.id, stage:d.order, locations:p.n, billing:p.billing, annual:p.annual, hostIds:l.hostId?[l.hostId]:[], createdAt:nowIso(), commStatus:'Pending', payment:'', paymentRef:'', startDate:'', notes:''}));
    }
  });
  if(!ok) return;
  const s=D.session; s.dials++; if(d.connect) s.connects++; s.talk+=talk; if(d.k==='Won') s.won++;
  toast(d.k==='Won' ? `Won! ${l.name} is on the board and an order was created.` : d.order ? 'Saved. A draft order was created.' : 'Saved.');
  Object.assign(D,{callSec:0, dispo:'', callSid:'', direction:'outbound', muted:false});
  setMyState('available');
  if(next) await loadNext(l.id); else { D.phase='ready'; render(); }
}
document.addEventListener('keydown', e=>{
  if(S.view!=='dialer' || !S.dial.leadId) return;
  if((e.ctrlKey||e.metaKey) && e.key==='Enter'){ e.preventDefault(); if(S.dial.dispo) saveWrap(true); else toast('Pick an outcome first.'); return; }
  if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName) || e.altKey || e.ctrlKey || e.metaKey) return;
  if(e.key==='s' || e.key==='S'){ e.preventDefault(); if(S.dial.phase==='oncall') endCall(); else { const a=document.querySelector('[data-act="startCall"]'); if(a) a.click(); } }
  else if((e.key==='k' || e.key==='K') && S.dial.phase!=='oncall'){ e.preventDefault(); loadNext(S.dial.leadId); }
  else { const d=DISPO.find(x=>x.key===e.key); if(d){ e.preventDefault(); pickDispo(d.k); } }
});

function filteredLeads(){
  const f=S.filters, q=f.q.trim().toLowerCase(), digits=q.replace(/\D/g,''), t=todayStr();

    if(f.status==='Open' && !OPEN.has(l.status)) return false;
    if(f.status==='Due' && !(OPEN.has(l.status) && l.followUp && l.followUp<=t)) return false;
    if(!['Open','Due','All'].includes(f.status) && l.status!==f.status) return false;
    if(f.rep==='Mine' && l.rep!==S.me.id) return false;
    if(f.rep==='Unassigned' && l.rep) return false;
    if(!['Anyone','Mine','Unassigned'].includes(f.rep) && l.rep!==f.rep) return false;

  }).sort((a,b)=>(a.name||'').localeCompare(b.name||''));

function weights(){ return Object.assign({}, DEFAULTS.weights, S.config.weights||{}); }
function vPipeline(){
  const scope=S.pipeScope||'all', w=weights();
  let leads=leadsArr(); if(scope==='mine') leads=leads.filter(l=>l.rep===S.me.id);
  const open=leads.filter(l=>OPEN.has(l.status)), openV=open.reduce((s,l)=>s+(Number(l.value)||0),0);
  const weighted=open.reduce((s,l)=>s+(Number(l.value)||0)*(w[l.status]||0)/100,0);
  const wonV=leads.filter(l=>l.status==='Won').reduce((s,l)=>s+(Number(l.value)||0),0);
  return `<div class="hd"><div><div class="eyebrow">Pipeline</div><h1>Where the money is sitting</h1></div><div class="seg"><button type="button" data-pscope="all" aria-pressed="${scope==='all'}">Whole team</button><button type="button" data-pscope="mine" aria-pressed="${scope==='mine'}">Mine</button></div></div>

function vWallboard(){
  const rows=teamIds().map(id=>({id, t:myToday(id), st:S.agentStatus.get(id)||{state:'offline'}}));
  const tot=rows.reduce((s,r)=>({dials:s.dials+r.t.dials, connects:s.connects+r.t.connects, talk:s.talk+r.t.talk, won:s.won+r.t.won}),{dials:0,connects:0,talk:0,won:0});
  const order={oncall:0,wrap:1,available:2,break:3,lunch:3,training:3,offline:4};
  rows.sort((a,b)=>(order[a.st.state]??5)-(order[b.st.state]??5) || b.t.dials-a.t.dials);
  const count=k=>rows.filter(r=>(r.st.state||'offline')===k).length;

async function fetchActs(fromIso, toIso){
  if(!db) return [];
  const out=[], seen=new Set(); let upper=toIso;
  for(let i=0;i<20;i++){
    const snap=await db.collection('activity').where('at','>=',fromIso).where('at','<',upper).orderBy('at','desc').limit(1000).get();
    for(const d of snap.docs){ if(!seen.has(d.id)){ seen.add(d.id); out.push(Object.assign({id:d.id},d.data())); } }
    if(snap.size<1000) break;
    upper = snap.docs[snap.docs.length-1].data().at;
  }
  return out;
}
async function runReport(){
  const r=S.report||(S.report={range:'7'}); r.loading=true; if(S.view==='reports') render();
  const days=Number(r.range)||7, start=startOfDay(new Date(Date.now()-(days-1)*864e5));

  r.loading=false; r.ranAt=Date.now(); if(S.view==='reports') render();
}

function parseRows(txt){
  const lines=String(txt||'').split(/\r?\n/).filter(x=>x.trim());
  if(lines.length<2) return {rows:[], cols:[]};
  const delim = lines[0].includes('\t') ? '\t' : lines[0].includes('|') ? '|' : ',';
  const split = s => { if(delim!==',') return s.split(delim).map(x=>x.trim()); const out=[]; let cur='', q=false; for(let i=0;i<s.length;i++){ const ch=s[i]; if(ch==='"'){ if(q && s[i+1]==='"'){ cur+='"'; i++; } else q=!q; } else if(ch===',' && !q){ out.push(cur.trim()); cur=''; } else cur+=ch; } out.push(cur.trim()); return out; };
  const alias={name:['name','business','business name','company'],phone:['phone','phone number','telephone','tel'],email:['email','e-mail'],website:['website','url','web','site'],address:['address','street','street address'],city:['city'],state:['state','st'],zip:['zip','zipcode','postal','postal code'],category:['type','category','industry'],contact:['contact','contact name','owner'],title:['title','role'],distance:['distance','miles','mi'],notes:['notes','note']};
  const cols=split(lines[0]).map(h=>Object.keys(alias).find(k=>alias[k].includes(h.toLowerCase()))||'');
  const rows=lines.slice(1,501).map(line=>{ const v=split(line), o={}; cols.forEach((c,i)=>{ if(c && v[i]!==undefined) o[c]=v[i]; }); return o; }).filter(o=>o.name);
  return {rows, cols:cols.filter(Boolean)};
}

/* ========================= Delegated events ========================= */
const V=$('view');
V.addEventListener('click', async e=>{
  if(e.target.closest('input,select,textarea,label')) { if(!e.target.closest('label.row')) return; }
  const t=e.target.closest('button, a, tr[data-open], tr[data-ord]'); if(!t) return;
  const ds=t.dataset;
  if(ds.viewGo){ e.preventDefault(); go(ds.viewGo); return; }
  if(ds.open){ e.preventDefault(); openRecord(ds.open); return; }
  if(ds.gord){ e.preventDefault(); S.ordEdit=ds.gord; S.ordFilter='All'; go('orders'); return; }
  if(ds.ord){ S.ordEdit=ds.ord; render(); return; }
  if(ds.dialnow){ dialLead(ds.dialnow); return; }
  if(ds.copy!=null){ copyText(ds.copy); return; }
  if(ds.done){ await guard(()=>db.doc('tasks/'+ds.done).update({done:true, doneAt:nowIso()}), 'Done.'); return; }
  if(ds.obj!=null){ const l=S.leads.get(S.dial.leadId); const [k,fn]=OBJECTIONS[Number(ds.obj)]; const b=$('objAns'); if(b&&l){ b.hidden=false; b.innerHTML=`<strong>${esc(k)}.</strong> ${fn(l)}`; } return; }
  if(ds.script){ S.scriptTab=ds.script; document.querySelectorAll('[data-script]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.script===ds.script))); $('scriptBox').innerHTML=scriptHtml(S.leads.get(S.dial.leadId), ds.script); return; }
  if(ds.dispo){ pickDispo(ds.dispo); return; }
  if(ds.cb){ setCallbackPreset(ds.cb); return; }
  if(ds.lt){ S.logType=ds.lt; document.querySelectorAll('[data-lt]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lt===ds.lt))); return; }
  if(ds.kind){ S.msgKind=ds.kind; S.msgTpl=''; render(); return; }
  if(ds.pscope){ S.pipeScope=ds.pscope; render(); return; }
  if(ds.tscope){ S.taskScope=ds.tscope; render(); return; }
  if(ds.of){ S.ordFilter=ds.of; render(); return; }
  if(ds.range){ S.report={range:ds.range}; runReport(); return; }
  if(ds.qasel){ S.qaState.sel=ds.qasel; render(); return; }
  if(ds.kb){ S.kbOpen=ds.kb; render(); return; }
  if(ds.kbedit){ S.kbEdit=ds.kbedit; render(); return; }
  if(ds.kbdel){ if(await guard(()=>db.doc('library/'+ds.kbdel).delete(),'Removed.')) S.kbOpen=''; return; }
  if(ds.delc){ const l=S.leads.get(S.recordId); if(await guard(()=>patchLead(l.id,{contacts:(l.contacts||[]).filter(c=>c.id!==ds.delc)}),'Contact removed.')) render(); return; }
  if(ds.deltpl){ if(await guard(()=>db.doc('templates/'+ds.deltpl).delete(),'Template deleted.')) S.msgTpl=''; return; }
  if(ds.undnc){ await guard(()=>db.doc('dnc/'+ds.undnc).delete(),'Removed from do-not-call.'); return; }
  if(ds.delann){ await guard(()=>db.doc('announcements/'+ds.delann).delete(),'Removed.'); return; }
  if(ds.archive){ await guard(()=>db.doc('campaigns/'+ds.archive).update({status:'Archived'}),'Campaign archived.'); return; }
  if(ds.distrib){ await distribute(ds.distrib); return; }
  if(ds.play){ const au=document.createElement('audio'); au.controls=true; au.autoplay=true; au.preload='auto'; au.src='/sales/api/recording?call='+encodeURIComponent(ds.play); au.onerror=()=>{ toast('No recording for this call.'); }; au.style.height='32px'; t.replaceWith(au); return; }
  if(ds.resetpw!==undefined){ S.resetFor=ds.resetpw; render(); return; }
  if(ds.reactivate){ try{ await HOST.users.update(ds.reactivate,{active:true}); toast('Reactivated.'); await loadLogins(); }catch(err){ toast(err.message); } return; }
  const act=ds.act; if(!act) return;
  if(act==='startCall'){ if(!startCall()) e.preventDefault(); return; }
  if(act==='startDialing'){ go('dialer'); if(!S.dial.leadId) loadNext(); return; }
  if(act==='loadNext'){ loadNext(); return; }
  if(act==='skip'){ loadNext(S.dial.leadId); return; }
  if(act==='endCall'){ endCall(); return; }
  if(act==='saveStay'){ saveWrap(false); return; }
  if(act==='exportCsv'){ exportLeads(); return; }
  if(act==='bulkApply'){ await bulkApply(); return; }
  if(act==='msgFor'){ S.msgLead=S.recordId; go('messages'); return; }
  if(act==='copyMsg'){ const subj=$('mSubj')?$('mSubj').value+'\n\n':''; copyText(subj+$('mBody').value,'Message copied.'); return; }
  if(act==='logSent'){ const l=S.leads.get(S.msgLead); if(!l) return; if(isDnc(l)){ toast('This account is on the do-not-call list.'); return; } await guard(()=>logAct({leadId:l.id, type:S.msgKind==='email'?'email':'text', outcome:'Sent', note:($('mSubj')?$('mSubj').value+': ':'')+$('mBody').value.slice(0,500)}),'Logged on the account.'); return; }
  if(act==='aiDraft'){ aiDraft(t); return; }
  if(act==='aiPrep'){ aiPrep(t); return; }
  if(act==='newTpl'){ S.msgTpl='__new'; render(); return; }
  if(act==='newOrderFor'){ const l=S.leads.get(S.recordId); Q={locs:l.locations||1,bill:l.billing||'yearly',biz:l.name,lead:l.id}; go('quote'); return; }
  if(act==='markDnc'){ const l=S.leads.get(S.recordId); if(!normPhone(l.phone)){ toast('This account has no phone number.'); return; } if(await guard(async()=>{ await setDoc('dnc/'+normPhone(l.phone),{phone:l.phone,name:l.name,reason:'Marked from account',at:nowIso(),by:S.me.id}); await patchLead(l.id,{status:'Do not contact'}); await logAct({leadId:l.id,type:'status',outcome:'Do not contact',note:'Added to the do-not-call list.'}); },'Added to do-not-call.')) render(); return; }
  if(act==='qApply'||act==='qOrder'){ const l=S.leads.get(Q.lead); if(!l) return; const p=priceFor(Q.locs,Q.bill); await guard(async()=>{ await patchLead(l.id,{locations:p.n,billing:p.billing,value:p.annual}); if(act==='qOrder') await setDoc('orders/'+newId(), stamp({leadId:l.id,name:l.name,repId:l.rep||S.me.id,stage:'Proposal sent',locations:p.n,billing:p.billing,annual:p.annual,hostIds:l.hostId?[l.hostId]:[],createdAt:nowIso(),commStatus:'Pending',payment:'',paymentRef:'',startDate:'',notes:''})); }, act==='qOrder'?'Order created.':`${l.name} set to ${money(p.annual)} per year.`); return; }
  if(act==='qCopy'){ copyText(quoteText(priceFor(Q.locs,Q.bill)),'Quote copied.'); return; }
  if(act==='closeOrd'){ S.ordEdit=''; render(); return; }
  if(act==='repCsv'){ reportCsv(); return; }
  if(act==='impPreview'){ const {rows,cols}=parseRows($('impText').value); $('impPrev').innerHTML = rows.length ? `<div class="small muted">${plural(rows.length,'row')} · columns found: ${esc(cols.join(', '))}</div><div class="tablewrap"><table><tbody>${rows.slice(0,5).map(r=>`<tr><td>${esc(r.name)}</td><td class="small">${esc(fmtPhone(r.phone))}</td><td class="small">${esc(r.category||'')}</td><td class="small">${esc(r.state||'')}</td></tr>`).join('')}</tbody></table></div>` : '<div class="small muted">Add a header row and at least one row with a business name.</div>'; return; }
  if(act==='kbNew'){ S.kbEdit=''; render(); return; }
  if(act==='mute'){ S.dial.muted=!S.dial.muted; HOST.voice.mute(S.dial.muted); t.textContent=S.dial.muted?'Unmute':'Mute'; return; }
  if(act==='sendEmail'||act==='sendSms'){ const l=S.leads.get(S.msgLead); if(!l) return; const c=(l.contacts||[]).find(x=>x.decisionMaker)||(l.contacts||[])[0];
    t.disabled=true; const label=t.textContent; t.textContent='Sending…';
    try{
      if(act==='sendEmail'){ const to=(c&&c.email)||l.email; if(!to){ toast('Add an email address to this account first.'); } else { const r=await HOST.email.send({to, subject:$('mSubj')?$('mSubj').value:'', body:$('mBody').value, leadId:l.id}); toast(`Sent from ${r.from||'your Gmail'} and logged.`); } }
      else { const to=(c&&c.phone)||l.phone; await HOST.sms.send({to, body:$('mBody').value, leadId:l.id}); toast('Text sent and logged.'); }
    }catch(err){ toast(err.message||'Couldn’t send.'); }
    t.disabled=false; t.textContent=label; return; }
  if(act==='gmailConnect'){ try{ await HOST.email.connect(); }catch(err){ toast(err.message||'Couldn’t start Google sign-in.'); } return; }
  if(act==='gmailDisconnect'){ try{ await HOST.email.disconnect(); toast('Gmail disconnected.'); render(); }catch(err){ toast(err.message); } return; }
  if(act==='backupExport'){ try{ const b=await HOST.backup.export(); await saveFile(`citypulse-sales-backup-${todayStr()}.json`, JSON.stringify(b)); }catch(err){ toast(err.message||'Couldn’t export.'); } return; }
  if(act==='restoreGo'){ const f=$('restoreFile'); if(!f||!f.files[0]){ toast('Choose a backup file first.'); return; } try{ const j=JSON.parse(await f.files[0].text()); const r=await HOST.backup.import(j); toast(`Restored ${r.restored} records. Reloading…`); setTimeout(()=>location.reload(),1200); }catch(err){ toast(err.message||'That file couldn’t be restored.'); } return; }
  if(act==='qaRefresh'){ S.qaState={}; render(); return; }
  if(act==='openEmail'){ toast('After you send it, press Log as sent.'); return; }
});

function showIncoming(info){
  let el=$('incomingBar'); if(!el){ el=document.createElement('div'); el.id='incomingBar'; el.setAttribute('role','alertdialog'); el.style.cssText='position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:70;background:var(--navy);color:#F4F6F7;border-radius:14px;padding:12px 16px;display:flex;gap:12px;align-items:center;box-shadow:0 12px 30px rgba(0,0,0,.3);max-width:calc(100% - 32px);flex-wrap:wrap'; document.body.appendChild(el); }
  const lead = leadsArr().find(l=>normPhone(l.phone)===normPhone(info.from) || (l.contacts||[]).some(c=>normPhone(c.phone)===normPhone(info.from)));
  el.hidden=false;
  el.innerHTML=`<strong>Incoming call</strong><span>${esc(lead?lead.name:fmtPhone(info.from)||'Unknown caller')}</span><button class="btn primary sm" type="button" id="inAccept">Answer</button><button class="btn sm" type="button" id="inReject" style="background:var(--navy-2);color:#F4F6F7;border-color:var(--navy-3)">Decline</button>`;
  $('inReject').onclick=()=>{ HOST.voice.reject(); el.hidden=true; };
  $('inAccept').onclick=()=>{
    if(S.dial.phase==='oncall'){ toast('Finish your current call first.'); return; }
    el.hidden=true;
    HOST.voice.accept({ onAccept: sid=>{ S.dial.callSid=sid||''; }, onEnd: ()=>{ if(S.dial.phase==='oncall') endCall(); else setMyState('wrap'); } });
    if(lead){ Object.assign(S.dial,{leadId:lead.id, phase:'oncall', callStart:Date.now(), dispo:'', callSid:'', direction:'inbound'}); setMyState('oncall',{leadId:lead.id}); go('dialer'); }
    else { setMyState('oncall'); go('inbound'); const ph=$('ibPhone'); if(ph) ph.value=info.from||''; const q=$('ibQ'); if(q) q.value=info.from||''; toast('New caller. Fill in the account while you talk.'); }
  };
}

/* ========================= Action helpers ========================= */
function newLead(o){ return Object.assign({hostId:'', name:'', category:'Other', phone:'', email:'', website:'', address:'', state:'', distance:null, contacts:[], status:'New', rep:'', campaignId:'', locations:1, billing:'yearly', value:399, attempts:0, nextCallAt:'', lastCallAt:'', lastDisposition:'', followUp:'', notes:'', source:'Added in CRM', createdAt:nowIso(), createdBy:S.me.id||'', updatedAt:nowIso(), updatedBy:S.me.id||''}, o); }
async function bulkApply(){
  const ids=[...S.filters.sel]; if(!ids.length){ toast('Select accounts first.'); return; }
  const who=$('bulkWho').value, camp=$('bulkCamp').value; if(!who && !camp){ toast('Pick an agent or a campaign.'); return; }
  const patch={}; if(who) patch.rep = who==='__none'?'':who; if(camp) patch.campaignId = camp==='__none'?'':camp;
  let n=0; for(const id of ids){ if(!(await guard(()=>patchLead(id,patch)))) break; n++; }
  S.filters.sel.clear(); toast(`Updated ${plural(n,'account')}.`); render();
}
async function distribute(campId){
  const agents=teamIds().filter(id=>['agent','supervisor'].includes(roleOf(id)));
  if(!agents.length){ toast('No active agents to assign to.'); return; }
  const ls=leadsArr().filter(l=>l.campaignId===campId && !l.rep && OPEN.has(l.status));
  if(!ls.length){ toast('No unassigned open leads in this campaign.'); return; }
  let i=0, n=0; for(const l of ls){ const who=agents[i++%agents.length]; if(!(await guard(()=>patchLead(l.id,{rep:who})))) break; n++; }
  toast(`Assigned ${plural(n,'lead')} across ${plural(agents.length,'agent')}.`); render();
}
async function importLeads(){
  const {rows}=parseRows($('impText').value); if(!rows.length){ toast('Nothing to import. Include a header row.'); return; }
  const hostId=$('impHost').value, campaignId=$('impCamp').value, who=$('impWho').value;
  const agents=teamIds().filter(id=>['agent','supervisor'].includes(roleOf(id)));
  const msg=$('impMsg'); let added=0, skipped=0, i=0;
  const phones=new Set(leadsArr().map(l=>normPhone(l.phone)).filter(Boolean));
  const names=new Set(leadsArr().filter(l=>l.hostId===hostId).map(l=>(l.name||'').toLowerCase()));
  for(const r of rows){
    const ph=normPhone(r.phone), nm=r.name.toLowerCase();
    if((ph && (phones.has(ph) || S.dnc.has(ph))) || names.has(nm)){ skipped++; continue; }
    const rep = who==='__rr' ? (agents.length ? agents[i++%agents.length] : '') : who;
    const cat = CATS.find(c=>c.toLowerCase()===String(r.category||'').toLowerCase()) || 'Other';
    const lead = newLead({hostId, campaignId, rep, name:r.name, phone:r.phone||'', email:r.email||'', website:r.website||'', address:[r.address,r.city,r.zip].filter(Boolean).join(', '), state:stateCode(r.state)||'', distance:r.distance&&!isNaN(Number(r.distance))?Number(r.distance):null, category:cat, notes:r.notes||'', source:'Import', contacts:r.contact?[{id:newId(),name:r.contact,title:r.title||'',phone:'',email:'',bestTime:'',decisionMaker:true}]:[]});
    if(!(await guard(()=>setDoc('leads/'+newId(), lead)))) break;
    if(ph) phones.add(ph); names.add(nm); added++; if(added%10===0 && msg) msg.textContent=`Imported ${added}…`;
  }
  if(msg) msg.textContent=''; toast(`Imported ${plural(added,'lead')}${skipped?`, skipped ${skipped} duplicates or do-not-call numbers`:''}.`);
  const t=$('impText'); if(t) t.value=''; const pv=$('impPrev'); if(pv) pv.innerHTML='';
}
function csvOf(head, rows){ const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"'; return [head.map(q).join(','), ...rows.map(r=>r.map(q).join(','))].join('\n'); }
async function saveFile(name, data){ if(!downloads){ toast('Downloads aren’t available in this view.'); return; } try{ await downloads.save({filename:name, data}); }catch(e){ if(!(e&&e.code==='declined')) toast('Couldn’t export the file.'); } }
function exportLeads(){ saveFile(`citypulse-accounts-${todayStr()}.csv`, csvOf(['Business','Type','Status','Phone','Email','Website','Address','State','Host','Campaign','Agent','Attempts','Last outcome','Next call','Package','Value per year','Notes'], filteredLeads().map(l=>[l.name,l.category,l.status,fmtPhone(l.phone),l.email,l.website,l.address,leadState(l),hostOf(l)?.name,S.campaigns.get(l.campaignId)?.name,l.rep?personName(l.rep):'',l.attempts||0,l.lastDisposition,l.nextCallAt,priceFor(l.locations||1,l.billing||'yearly').label,l.value,l.notes]))); }
function reportCsv(){ const acts=((S.report||{}).acts||[]).filter(a=>a.type==='call'); saveFile(`citypulse-calls-${todayStr()}.csv`, csvOf(['When','Agent','Account','Outcome','Conversation','Seconds','Direction','Notes'], acts.map(a=>[a.at,personName(a.by),S.leads.get(a.leadId)?.name||'',a.disposition||a.outcome,a.connect?'Yes':'No',a.durationSec||0,a.direction||'',a.note||'']))); }

async function aiDraft(btn){
  const l=S.leads.get(S.msgLead); if(!l||!sample) return; const kind=S.msgKind||'sms', h=hostOf(l), p=priceFor(l.locations||1,l.billing||'yearly');
  const hist=(S.recordId===l.id?S.recordActs:[]).filter(a=>a.note).slice(0,4).map(a=>`- ${a.type} ${a.disposition||a.outcome||''}: ${a.note}`).join('\n')||'- none';
  btn.disabled=true; btn.textContent='Drafting…';
  const prompt=`Write a ${kind==='email'?'short email under 130 words, with the first line "Subject: …"':kind==='sms'?'text message under 300 characters':'voicemail script under 40 seconds when spoken'} from a CityPulse Kiosks sales agent named ${firstName(S.me.id)} to ${l.name}${(l.contacts||[])[0]?' (contact: '+l.contacts[0].name+')':''}. Return only the message.
Facts you may use, and nothing else:
- CityPulse kiosks are touch screens at venues where guests find places nearby. Local ads rotate on screen with a QR code. The kiosk counts ad views and QR scans.
- Host: ${h?h.name:'a nearby venue'} (${h?.venueType||'venue'}), status ${h?.status||'Prospective'}. ${h?.status==='Live'?'It is live.':'It is not live yet. Do not say it is live.'}
- Distance: ${l.distance!=null&&l.distance!==''?Number(l.distance).toFixed(1)+' miles':'nearby'}. Business type: ${l.category}.
- Quoted: ${p.label}, ${p.billing==='monthly'?money(p.monthly)+'/month':money(p.annual)+'/year'}. Published pricing: $399/yr for one location, $1,099/yr for three, $1,200/yr for five, +$300/yr each after five, or $60/month per location.
- History:\n${hist}
Rules: no promises of results or customers; no invented discounts, deadlines or statistics.${kind==='sms'?' End with "Reply STOP to opt out."':''} Offer a mock-up of their ad and ask for a time to talk. Sign as ${firstName(S.me.id)}, CityPulse Kiosks.`;
  try{ const out=await sample(prompt,{modelTier:'quick', onText:({text})=>{ const b=$('mBody'); if(b) b.value=text; }}); const b=$('mBody'); if(b){ let txt=out.text; if(kind==='email' && /^Subject:/i.test(txt)){ const [first,...rest]=txt.split('\n'); if($('mSubj')) $('mSubj').value=first.replace(/^Subject:\s*/i,''); txt=rest.join('\n').trim(); } b.value=txt; } }
  catch(e){ toast(e&&e.code==='not_granted'?'Claude drafting isn’t allowed on this page.':e&&e.code==='rate_limited'?'Too many drafts. Try again in a minute.':'Couldn’t draft right now.'); }
  btn.disabled=false; btn.textContent='Draft with Claude';
}
async function aiPrep(btn){
  const l=S.leads.get(S.recordId); if(!l||!sample) return; const h=hostOf(l);
  btn.disabled=true; btn.textContent='Reading…';
  const hist=S.recordActs.slice(0,25).map(a=>`${(a.at||'').slice(0,10)} ${a.type} ${a.disposition||a.outcome||''} ${a.note||''}`).join('\n')||'none';
  const prompt=`Help a CityPulse Kiosks sales agent prepare for a call. In under 110 words give: (1) a two-sentence summary of where this account stands, (2) the single best next step, (3) one question to ask. Use only these facts and say when something is unknown.
Account: ${l.name}, ${l.category}, status ${l.status}, ${Number(l.attempts)||0} attempts, last outcome ${l.lastDisposition||'none'}. Contacts: ${(l.contacts||[]).map(c=>c.name+(c.title?' ('+c.title+')':'')+(c.decisionMaker?', decision maker':'')).join('; ')||'none'}. Notes: ${l.notes||'none'}.
Host: ${h?h.name+' ('+h.status+')':'unknown'}. Quoted: ${priceFor(l.locations||1,l.billing||'yearly').label}, ${money(l.value)}/yr.
History, newest first:\n${hist}`;
  try{ const out=await sample(prompt,{modelTier:'quick', onText:({text})=>{ const b=$('aiPrep'); if(b) b.textContent=text; }}); S.aiPrep={id:l.id,text:out.text}; const b=$('aiPrep'); if(b) b.textContent=out.text; }
  catch(e){ toast(e&&e.code==='not_granted'?'Claude isn’t allowed on this page.':'Couldn’t prepare a brief right now.'); }
  btn.disabled=false; btn.textContent='Brief me with Claude';
}

/* ========================= Profiles ========================= */
let profBusy=false;
async function refreshProfiles(){
  if(!user || profBusy) return;
  const ids=new Set(teamIds()); S.todayActs.forEach(a=>a.by&&ids.add(a.by)); S.recordActs.forEach(a=>a.by&&ids.add(a.by)); S.orders.forEach(o=>o.repId&&ids.add(o.repId)); S.tasks.forEach(t=>t.assignee&&ids.add(t.assignee)); S.qa.forEach(q=>q.agent&&ids.add(q.agent));
  const need=[...ids].filter(id=>id && !String(id).startsWith('legacy:') && !(id in S.profiles)).slice(0,64);
  if(!need.length) return; profBusy=true;
  try{ const ps=await user.profiles(need); need.forEach(id=>S.profiles[id]=ps[id]||{name:''}); schedule(); }catch(e){ need.forEach(id=>S.profiles[id]={name:''}); }
  profBusy=false;
}

/* ========================= Boot ========================= */
try{ const th=store.get('cp.theme'); if(th) document.documentElement.setAttribute('data-theme',th); }catch(e){}
renderStatePill(); render();
(async ()=>{
  const cl=window.claude; if(!cl||!cl.use){ renderNotice(); return; }
  const [d,u,s,dl]=await Promise.all([cl.use('db'),cl.use('user'),cl.use('sample'),cl.use('downloads')]);
  db=d; user=u; sample=s; downloads=dl;
  if(user){
    try{ S.me.id=await user.id(); }catch(e){}
    try{ const me=await user.me(); S.me.name=me.name||''; S.me.avatar=me.avatarUrl||''; }catch(e){}
    try{ S.isOwner=await user.isOwner(); }catch(e){}
    try{ S.canEdit=await user.canEdit(); }catch(e){}
    try{ const c=await user.can('data.write'); if(c===false) S.canWrite=false; }catch(e){}
  }
  render();
  if(!db) return;
  const err = e => { if(e && e.code==='revoked'){ db=null; renderNotice(); } };
  const intoMap = (key, after) => snap => { const m=new Map(); snap.docs.forEach(x=>m.set(x.id,Object.assign({id:x.id},x.data()))); S[key]=m; S.loaded[key]=true; if(after) after(); schedule(); };
  db.collection('hosts').onSnapshot(intoMap('hosts'), err);
  db.collection('orders').limit(1000).onSnapshot(intoMap('orders', refreshProfiles), err);
  db.collection('tasks').where('done','==',false).limit(1000).onSnapshot(intoMap('tasks', ()=>{ checkReminders(); refreshProfiles(); }), err);
  db.collection('campaigns').onSnapshot(intoMap('campaigns'), err);
  db.collection('dnc').limit(1000).onSnapshot(intoMap('dnc'), err);
  db.collection('templates').onSnapshot(intoMap('templates'), err);
  db.collection('library').onSnapshot(intoMap('library'), err);
  db.collection('announcements').onSnapshot(intoMap('ann'), err);
  db.collection('staff').onSnapshot(intoMap('staff', refreshProfiles), err);
  db.collection('agentStatus').onSnapshot(intoMap('agentStatus', refreshProfiles), err);
  db.collection('members').onSnapshot(intoMap('members', refreshProfiles), err);
  db.collection('qa').limit(1000).onSnapshot(intoMap('qa'), err);
  db.doc('config/main').onSnapshot(snap=>{ S.config=snap.exists?snap.data():{}; schedule(); }, err);
  // today's activity; re-subscribes after midnight so counters reset
  let todayUnsub=null, todayKey='';
  const subToday=()=>{ const k=todayStr(); if(k===todayKey) return; todayKey=k; if(todayUnsub) todayUnsub(); S.todayActs=[];
    todayUnsub=db.collection('activity').where('at','>=',startOfDay().toISOString()).orderBy('at','desc').limit(1000).onSnapshot(snap=>{ S.todayActs=snap.docs.map(x=>Object.assign({id:x.id},x.data())); schedule(); refreshProfiles(); }, err); };
  subToday(); setInterval(subToday, 60000);
  if(S.me.id) db.doc('data/users/'+S.me.id+'/prefs').onSnapshot(snap=>{ S.prefs=snap.exists?snap.data():{}; schedule(); }, ()=>{});
  const boot = new Date(Date.now()-120000).toISOString();
  try{
    let after='';
    for(let i=0;i<40;i++){
      const q = after ? db.collection('leads').where('createdAt','>=',after).orderBy('createdAt').limit(1000) : db.collection('leads').orderBy('createdAt').limit(1000);
      const snap=await q.get(); let fresh=0;
      snap.docs.forEach(x=>{ if(!S.leads.has(x.id)) fresh++; S.leads.set(x.id,Object.assign({id:x.id},x.data())); });
      if(snap.size<1000 || !fresh) break; after=snap.docs[snap.docs.length-1].data().createdAt;
    }
    if(!S.leads.size){ const snap=await db.collection('leads').limit(1000).get(); snap.docs.forEach(x=>S.leads.set(x.id,Object.assign({id:x.id},x.data()))); }
  }catch(e){ console.error(e); try{ const snap=await db.collection('leads').limit(1000).get(); snap.docs.forEach(x=>S.leads.set(x.id,Object.assign({id:x.id},x.data()))); }catch(x){} }
  S.loaded.leads=true; schedule();
  db.collection('leads').where('updatedAt','>=',boot).orderBy('updatedAt','desc').limit(1000).onSnapshot(snap=>{ snap.docChanges().forEach(ch=>{ if(ch.type!=='removed') S.leads.set(ch.doc.id,Object.assign({id:ch.doc.id},ch.doc.data())); }); schedule(); }, err);
  if(S.me.id && S.canWrite){
    try{ const m=await db.doc('members/'+S.me.id).get(); if(!m.exists) await db.doc('members/'+S.me.id).set({joinedAt:nowIso()}); }catch(e){}
    try{ const st=await db.doc('agentStatus/'+S.me.id).get(); if(st.exists){ const x=st.data(); S.myState = x.state==='oncall'||x.state==='wrap' ? 'available' : (x.state||'offline'); S.stateSince=x.since?new Date(x.since).getTime():Date.now(); } renderStatePill(); }catch(e){}
  }
  window.addEventListener('pagehide', ()=>{ if(db && S.me.id && S.canWrite && S.myState!=='offline'){ try{ db.doc('agentStatus/'+S.me.id).set({state:'offline', since:nowIso(), leadId:''}); }catch(e){} } });
})();
})();
</script>
