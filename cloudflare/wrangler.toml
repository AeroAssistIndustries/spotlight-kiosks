# Optional: deploy from a terminal with `npx wrangler deploy` (the dashboard paste method in README.md also works).
name = "spotlight-kiosks"
main = "concierge-worker.js"
compatibility_date = "2026-09-01"

[vars]
VENUE_URL = "https://aeroassistindustries.github.io/spotlight-kiosks/assets/lexen-data.json"
ALLOWED_ORIGINS = "https://aeroassistindustries.github.io"
MODEL = "claude-haiku-5-5"
CF_MODEL = "@cf/meta/llama-3.1-8b-instruct"

# Free AI: Cloudflare Workers AI. No key needed.
[ai]
binding = "AI"

# Optional: to use Claude instead of the free model, add a secret ANTHROPIC_API_KEY
# with `npx wrangler secret put ANTHROPIC_API_KEY` or in the dashboard.
